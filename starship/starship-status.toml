# Starship modules rendered into the byobu status bar (bin/context-status).
# The shell prompt lives in starship.toml.

add_newline = false
command_timeout = 1200
palette = "synthwave84"
format = "$git_branch$git_status$python$golang$kubernetes$terraform"

[palettes.synthwave84]
fg = "#ffffff"
pink = "#ff7edb"
purple = "#b893ce"
cyan = "#36f9f6"
green = "#72f1b8"
orange = "#fede5d"
red = "#fe4450"
muted = "#a99bbd"

# GIT BRANCH

[git_branch]
symbol = "󰘬 "
style = "bold pink"
format = "[$symbol$branch ]($style)"

# GIT STATUS

[git_status]
disabled = false
style = "bold orange"
format = '([$all_status$ahead_behind ]($style))'

conflicted = '[!${count}](bold red) '
stashed = '[*${count}](purple) '
deleted = '[-${count}](red) '
renamed = '[»${count}](cyan) '
modified = '[~${count}](orange) '
typechanged = '[T${count}](orange) '
staged = '[+${count}](green) '
untracked = '[?${count}](pink) '

ahead = '[⇡${count}](green) '
behind = '[⇣${count}](orange) '
diverged = '[⇡${ahead_count}⇣${behind_count}](red) '
up_to_date = '[✓](green) '

# LANGUAGES

[python]
symbol = "󰌠 "
style = "green"
format = '[$symbol$version( \($virtualenv\)) ]($style)'

[golang]
symbol = "󰟓 "
style = "cyan"
format = "[$symbol$version ]($style)"

# KUBERNETES

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "bold purple"
format = '[$symbol$context( \($namespace\)) ]($style)'

# Production contexts turn red
[[kubernetes.contexts]]
context_pattern = ".*prod.*"
style = "bold red"

# TERRAFORM

[terraform]
symbol = "󱁢 "
style = "pink"
format = "[$symbol$version ]($style)"
