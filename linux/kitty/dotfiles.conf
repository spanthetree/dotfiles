# kitty: settings for byobu, and the look (theme.conf). Only used when kitty is installed (packages.yaml on a
# desktop): linux/install.sh links this file and theme.conf into ~/.config/kitty and adds
# `include ~/.config/kitty/dotfiles.conf` at the end of each kitty.conf kitty reads, so they win over its settings:
# ~/.config/kitty/kitty.conf, and under Hyprland the desktop setup's UserConfigs/kitty.conf (its KITTY_CONFIG_DIRECTORY).

include ~/.config/kitty/theme.conf

# Login shell, so ~/.zprofile runs and byobu auto-starts
shell zsh --login
# Hosts reached over ssh rarely have kitty's terminfo; xterm-256color works everywhere
term xterm-256color

# kitty's own shortcuts take keys byobu uses (Ctrl-Shift-T/W/N/E/P/Up/PgUp...): drop them all, keep copy/paste and new tab
clear_all_shortcuts yes
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
# Ctrl-Shift-T: byobu's new tab, sent the way Windows Terminal sends it (see linux/byobu/profile.tmux)
map ctrl+shift+t send_text all \x1b[116;6u
# Ctrl-Shift-N: byobu's new session, the same way
map ctrl+shift+n send_text all \x1b[110;6u
# Ctrl-T: kitty's own new tab (like Windows Terminal's)
map ctrl+t new_tab
