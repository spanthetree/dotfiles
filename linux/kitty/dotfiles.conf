# kitty: settings for byobu. Only used when kitty is installed (e.g. by a Hyprland desktop setup):
# linux/install.sh links this file and adds `include dotfiles.conf` at the end of ~/.config/kitty/kitty.conf,
# so it wins over that file's settings. Colours and font stay with kitty.conf.

# Login shell, so ~/.zprofile runs and byobu auto-starts (like linux/terminator/config)
shell zsh --login
# Hosts reached over ssh rarely have kitty's terminfo; xterm-256color works everywhere
term xterm-256color

# kitty's own shortcuts take keys byobu uses (Ctrl-Shift-T/W/N/E/P/Up/PgUp...): drop them all, keep copy/paste
clear_all_shortcuts yes
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
# Ctrl-Shift-T: byobu's new tab, sent the way Windows Terminal sends it (see linux/byobu/profile.tmux)
map ctrl+shift+t send_text all \x1b[116;6u
