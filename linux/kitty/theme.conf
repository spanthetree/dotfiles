# kitty: the look, the same in every session (Ubuntu's GNOME and Hyprland). Included from dotfiles.conf.
# Font, opacity and size from the Hyprland desktop setup's kitty.conf; colours SynthWave '84, as in Windows Terminal
# (windows/terminal/settings.patch.json) and byobu (tabs, borders), instead of wallust's from the wallpaper.

font_family FantasqueSansM Nerd Font Mono
font_size 14.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity 1
# Frosted glass behind the see-through background, as Hyprland's blur. Asked of the compositor: COSMIC and KDE do it;
# Hyprland ignores it (it blurs on its own); GNOME has none.
background_blur 1
confirm_os_window_close 0

# Animated cursor (kitty 0.37+)
cursor_trail 1

# Opening size: 134 x 43 cells. Tiling (Hyprland) ignores it; floating windows and GNOME use it.
remember_window_size no
initial_window_width 134c
initial_window_height 43c
window_padding_width 4

scrollback_lines 2000
wheel_scroll_min_lines 1
enable_audio_bell no

selection_foreground none
selection_background #30303A

foreground #FFFFFF
background #111018
cursor     #36F9F6
cursor_text_color #111018

# Tabs and borders as in byobu (linux/byobu/profile.tmux)
active_tab_foreground   #111018
active_tab_background   #FF7EDB
inactive_tab_foreground #B893CE
inactive_tab_background #111018

active_border_color   #FF7EDB
inactive_border_color #49375F
bell_border_color     #FEDE5D

color0  #000000
color1  #FE4450
color2  #72F1B8
color3  #FEDE5D
color4  #36F9F6
color5  #FF7EDB
color6  #36F9F6
color7  #F8F8F2
color8  #6A5A7A
color9  #FF6E76
color10 #A5F7CE
color11 #FFF3A3
color12 #80FFFF
color13 #FFA6E8
color14 #9AFFFF
color15 #FFFFFF
