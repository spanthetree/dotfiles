# Connection reuse (linux/ssh/dotfiles-mux.conf, copied to ~/.ssh/dotfiles-mux.conf), for hosts you tag: a second
# ssh, scp, rsync or git to the same host opens at once over the first one's connection, which stays up 10 minutes
# after the last session ends. To turn it on, in your ~/.ssh/config:
#   Host build-box db-*     (or Host *, for every host)
#     Tag mux
# Opt-in, because network gear (IOS, NX-OS, Junos...) often allows one session per connection, and a kept-open
# connection holds a vty line. `ssh -O exit <host>` closes one now. Needs OpenSSH 9.4+ (Match tagged): the installer
# copies this file only there, since an older ssh would reject the whole config.
Match tagged mux
  ControlMaster auto
  ControlPath ~/.ssh/cm-%C
  ControlPersist 10m
