# Shared SSH client defaults from the dotfiles repo (linux/ssh/dotfiles.conf), copied to ~/.ssh/dotfiles.conf (mode
# 600: ssh refuses a config others can write) by the installer on each run. Edit the repo's file, not the copy.
# The installer includes it at the END of ~/.ssh/config: ssh takes the first value it finds for each setting, so
# anything in your own config wins. No hosts here: yours stay in ~/.ssh/config, never in the repo.

# Notice a dead connection within ~90s and end it, instead of a frozen terminal (sleep, Wi-Fi or VPN changes)
ServerAliveInterval 30
ServerAliveCountMax 3
