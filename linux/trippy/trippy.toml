# trippy (`trip`): linked to ~/.config/trippy/trippy.toml. Only what differs from trippy's defaults; the full list
# with comments: trip --print-config-template
#
# GeoIP (the map on `m`, locations per hop) isn't set here: trippy wants a full path with no `~`, and stops if the
# file is missing. The `trip` function in linux/zsh/zshrc adds `-G` when the database is there (the installer gets
# it from MaxMind: configure_geoip in linux/install.sh).

[dns]
# AS numbers and names per hop. The system resolver can't look them up, so DNS goes to Cloudflare.
dns-resolve-method = "cloudflare"
dns-lookup-as-info = true

[tui]
tui-address-mode = "both"   # IP and hostname
tui-geoip-mode = "short"    # only shown when a GeoIP file is given

