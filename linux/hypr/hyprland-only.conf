# Ubuntu's hypridle, hyprpaper and swaync packages enable their systemd user services for every graphical session, so
# they also started under COSMIC and GNOME: hypridle then ran hyprlock on idle, which crashed there (and two idle
# daemons locked the screen). Linked as a drop-in for each (linux/install.sh, where Hyprland is installed): they start
# only when the session is Hyprland. The Hyprland desktop setup imports XDG_CURRENT_DESKTOP into systemd at login
# before it starts them itself, so under Hyprland nothing changes.
[Unit]
ConditionEnvironment=XDG_CURRENT_DESKTOP=Hyprland
