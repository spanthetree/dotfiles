# swaync (the desktop setup's notifications) only while waybar is the panel: wayle has its own notifications, and
# the two can't both own them. Linked as a drop-in for swaync.service (linux/install.sh, where Hyprland is installed),
# next to hyprland-only.conf. The desktop setup starts swaync at login; with wayle chosen (linux/hypr/panel.sh) the
# start is skipped quietly instead of swaync appearing until panel.sh's watcher stops it. If panel.sh isn't there,
# swaync starts as before.
[Service]
ExecCondition=/bin/sh -c '[ ! -x %h/.config/hypr/dotfiles-panel.sh ] || %h/.config/hypr/dotfiles-panel.sh swaync'
