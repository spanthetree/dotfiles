# Packages for every machine. Edit this file, then re-run the installer:
#   linux:   ~/dotfiles/install.sh   (Debian/Ubuntu; also installs the windows list under WSL)
#   windows: install.ps1
#
# A plain string is a package name: apt package (linux) or winget id (windows).
# A map adds options. Linux keys (all optional except name):
#   repo:    extra apt source, refreshed every run (keys rotate):
#            {name, key: <gpg key url>, url: <deb url>, suite: <default: distro codename>, components: <default: main>}
#   github:  owner/repo; installs a binary from the latest release into ~/.local/bin, and updates it on later runs
#            asset: release file name (.tar.gz/.tar.xz/.zip, or the bare binary)
#            file: path of the binary inside the archive (default: name)
#   script:  shell that installs it
#   skip_if: shell test; when it succeeds the install is skipped
#            (default for github/script: the command <name> exists)
#   update:  shell run on every run when already installed
#   post:    shell run on every run after installing
#   when:    desktop | wsl; install only on such machines
#            cosmic: only where the COSMIC desktop is chosen (install.cmd --cosmic; --no-cosmic drops it and offers to
#            uninstall these, apt repo included)
#            hyprland: the same for the Hyprland desktop setup (install.cmd --hyprland / --no-hyprland)
#   interactive: true runs script/update/post/uninstall in the terminal, without the spinner, so a prompt
#            the step can't avoid (e.g. a tool that runs sudo itself and asks again) is seen and answered
#   tools:   (go, pyenv, rbenv entries only) tools installed with that language's own installer, after it.
#            Each is a name, or {name, version}. Removing a line uninstalls that tool.
#              go:    go install <module path>@<version, default latest>   -> ~/go/bin
#              pyenv: uv tool install <name><version, e.g. '>=24'>         -> ~/.local/bin, isolated env per tool
#              rbenv: gem install <name> -v <version, e.g. '~> 8.0'>      -> rbenv's global Ruby
#   Shell steps run in bash, with $DOT set to this repo.
#   uninstall: shell that removes it (default: apt remove for apt, delete ~/.local/bin/<name> for github;
#            script installs without one are only warned about)
# Placeholders in asset/file: {tag} v1.2.3, {version} 1.2.3, {arch} amd64/arm64,
#   {m} x86_64/aarch64, {xarch} x86_64/arm64
# Windows keys: id; font: font file prefix (a hand-installed font isn't listed by winget).
#
# Removing: delete the entry and re-run. The installer uninstalls it (after asking) if it installed it on this
# machine. `install.sh --adopt` once treats everything already installed from this list as its own.

settings:
  autoremove: true   # after uninstalling apt packages, also `apt-get autoremove` their leftover dependencies
  upgrade: true      # each run also `apt-get upgrade`s the whole system (GitHub binaries update to their latest release regardless)

linux:
  # base
  - git
  - curl
  - ca-certificates
  - gnupg
  - gpg
  - openssl
  - unzip
  - xclip

  # shell and editor
  - zsh
  - byobu
  - tmux
  - vim
  - fzf
  - ripgrep
  - fd-find
  - zoxide
  - eza
  - bat
  - direnv
  - btop
  - ncdu
  - name: tealdeer
    post: '[ -d ~/.cache/tealdeer ] || tldr --update >/dev/null 2>&1 || true'
  - name: starship
    script: curl -fsSL https://starship.rs/install.sh | sh -s -- -y -b ~/.local/bin >/dev/null
    uninstall: rm -f ~/.local/bin/starship

  # modern replacements for classic tools (old one in the comment)
  - duf          # df
  - gdu          # ncdu, faster
  - sd           # sed find/replace
  - hexyl        # xxd/hexdump
  - hyperfine    # time, benchmarking
  - entr         # rerun on file change
  - just         # make, as a task runner
  - name: dust   # du
    github: bootandy/dust
    asset: dust-{tag}-{m}-unknown-linux-musl.tar.gz
    file: dust-{tag}-{m}-unknown-linux-musl/dust
  - name: yazi   # file manager
    github: sxyazi/yazi
    asset: yazi-{m}-unknown-linux-musl.zip
    file: yazi-{m}-unknown-linux-musl/yazi
  - name: broot  # tree/cd navigator
    github: Canop/broot
    asset: broot_{version}.zip
    file: '{m}-unknown-linux-musl/broot'
  - name: ouch   # tar/zip/unzip
    github: ouch-org/ouch
    asset: ouch-{m}-unknown-linux-musl.tar.gz
    file: ouch-{m}-unknown-linux-musl/ouch
  - name: choose # cut / awk '{print $2}'
    github: theryangeary/choose
    asset: choose-{m}-unknown-linux-musl
  - libxcb-render0 # jless links these (clipboard)
  - libxcb-shape0
  - libxcb-xfixes0
  - name: jless  # JSON viewer (x86_64 only)
    github: PaulJuliusMartinez/jless
    asset: jless-{tag}-{m}-unknown-linux-gnu.zip
  - name: fx     # JSON viewer
    github: antonmedv/fx
    asset: fx_linux_{arch}
  - name: difft  # difftastic: structural diff
    github: Wilfred/difftastic
    asset: difft-{version}-{m}-unknown-linux-musl.tar.gz
  - name: procs  # ps
    github: dalance/procs
    asset: procs-{tag}-{m}-linux.zip
  - name: viddy  # watch
    github: sachaos/viddy
    asset: viddy-{tag}-linux-{m}.tar.gz
  - name: watchexec # rerun on file change
    github: watchexec/watchexec
    asset: watchexec-{version}-{m}-unknown-linux-gnu.tar.xz
    file: watchexec-{version}-{m}-unknown-linux-gnu/watchexec
  - name: scc    # cloc/tokei (tokei has no recent release binaries)
    github: boyter/scc
    asset: scc_Linux_{xarch}.tar.gz

  - name: fontconfig   # fc-cache, for the fonts below
    when: desktop
  - name: jetbrainsmono-nerd-font   # starship icons need a Nerd Font; VS Code's and the hyprbars title bars' font
    when: desktop
    skip_if: test -d ~/.local/share/fonts/JetBrainsMonoNerdFont
    script: |
      set -eo pipefail
      tmp=$(mktemp -d) && mkdir -p ~/.local/share/fonts
      curl -fsSL https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.tar.xz | tar -xJ -C "$tmp"
      mv "$tmp" ~/.local/share/fonts/JetBrainsMonoNerdFont  # only once complete: skip_if tests this dir
      fc-cache -f ~/.local/share/fonts
    uninstall: rm -rf ~/.local/share/fonts/JetBrainsMonoNerdFont && { ! command -v fc-cache >/dev/null || fc-cache -f; }   # fontconfig may be removed first
  - name: kitty   # terminal emulator; config in linux/kitty (dotfiles.conf: byobu keys, theme.conf: the look)
    when: desktop
  - name: fantasquesansmono-nerd-font   # kitty's font (linux/kitty/theme.conf)
    when: desktop
    # a Hyprland desktop setup may have installed it already (its own copy and its own uninstall): then skipped
    skip_if: test -d ~/.local/share/fonts/FantasqueSansMNerdFont || fc-list | grep -q 'FantasqueSansM Nerd Font Mono'
    script: |
      set -eo pipefail
      tmp=$(mktemp -d) && mkdir -p ~/.local/share/fonts
      curl -fsSL https://github.com/ryanoasis/nerd-fonts/releases/latest/download/FantasqueSansMono.tar.xz | tar -xJ -C "$tmp"
      mv "$tmp" ~/.local/share/fonts/FantasqueSansMNerdFont  # only once complete: skip_if tests this dir
      fc-cache -f ~/.local/share/fonts
    uninstall: rm -rf ~/.local/share/fonts/FantasqueSansMNerdFont && { ! command -v fc-cache >/dev/null || fc-cache -f; }   # fontconfig may be removed first
  # The Hyprland desktop setup, opt-in: ./install.cmd --hyprland (Ubuntu 26.04+). LinuxBeginnings/Ubuntu-Hyprland's
  # installer (Hyprland from its PPA, waybar, rofi, swaync, hyprlock, ...) with its Hyprland config Hyprland-Dots;
  # linux/hypr/dotfiles.lua and the entries below sit on top of it. Both pinned: bump INSTALLER / DOTS + VERSION to
  # move on, after a test run. The installer still asks a few questions (its checklist opens with linux/hypr/preset.sh
  # ticked), and so does an upgrade of its config, hence interactive. The entries below (hyprbars, hyprshell, wayle...)
  # keep `when: desktop`: they work with any Hyprland, however it was installed.
  - name: hyprland-desktop
    when: hyprland
    interactive: true
    skip_if: command -v Hyprland >/dev/null && [ -d ~/.config/hypr ]
    script: |
      set -e
      INSTALLER=e6a7331724b15e5df31c520900acf076dec8790a   # branch 26.04
      . /etc/os-release
      dpkg --compare-versions "$VERSION_ID" ge 26.04 || { echo "the Hyprland desktop setup needs Ubuntu 26.04+ (this is $VERSION_ID)"; exit 1; }
      dir=~/.local/share/dotfiles/ubuntu-hyprland
      rm -rf "$dir"; mkdir -p "$(dirname "$dir")"
      git clone -q -b 26.04 https://github.com/LinuxBeginnings/Ubuntu-Hyprland "$dir"
      git -C "$dir" checkout -q "$INSTALLER"
      cd "$dir"
      ./install.sh --install-ppa --preset "$DOT/linux/hypr/preset.sh"
    # its config to the pinned version when the installed one is older (a fresh install takes the latest, so newer)
    update: |
      set -e
      DOTS=170b69b846b1cd92ebc6d81c17393e17bed8d416 VERSION=2.3.28.3   # Hyprland-Dots main (no tag past v2.3.19)
      have=$(for d in ~/.config/hypr/v[0-9]*; do [ -e "$d" ] && echo "${d##*/v}"; done | sort -V | tail -1)
      [ -n "$have" ] || exit 0   # not its config (Hyprland set up some other way): nothing to upgrade
      dpkg --compare-versions "$have" lt "$VERSION" || exit 0
      echo "Hyprland config: $have -> $VERSION"
      tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
      git clone -q https://github.com/LinuxBeginnings/Hyprland-Dots "$tmp/dots"
      git -C "$tmp/dots" checkout -q "$DOTS"
      cd "$tmp/dots" && bash copy.sh --express-upgrade
    # its own uninstaller, told exactly what to remove: everything it lists except what this repo installs too
    # (kitty and btop: packages.yaml; slurp: screen recording under COSMIC) and ~/.config/kitty (linux/kitty)
    uninstall: |
      set -e
      INSTALLER=e6a7331724b15e5df31c520900acf076dec8790a
      dir=~/.local/share/dotfiles/ubuntu-hyprland
      if [ ! -x "$dir/uninstall.sh" ]; then
        rm -rf "$dir"; mkdir -p "$(dirname "$dir")"
        git clone -q -b 26.04 https://github.com/LinuxBeginnings/Ubuntu-Hyprland "$dir"
        git -C "$dir" checkout -q "$INSTALLER"
      fi
      cd "$dir"
      ./uninstall.sh --yes \
        --packages "brightnessctl cava cliphist fastfetch ffmpegthumbnailer grim polkit-kde-agent-1 imagemagick
          qt-style-kvantum qt-style-kvantum-themes libqt5quick5 libqt5qml5 qt6-declarative-dev mousepad mpv mpv-mpris
          nvtop nwg-displays nwg-look pamixer pavucontrol playerctl qalculate-gtk qt5ct qt6-svg qt6ct swappy
          sway-notification-center swww thunar thunar-archive-plugin thunar-volman tumbler wallust waybar wl-clipboard
          wlogout xdg-desktop-portal-hyprland yad yt-dlp xarchiver hyprland xfce-polkit" \
        --dirs "ags btop cava fastfetch hypr Kvantum qt5ct qt6ct rofi swappy swaync Thunar wallust waybar wlogout"
      cd ~ && rm -rf "$dir"
  - name: hyprbars   # Hyprland title bars: drag to move, minimize/maximize/close; settings in linux/hypr/dotfiles.lua
    when: desktop
    interactive: true   # hyprpm runs sudo itself, and can ask for the password again
    # installed = built and enabled (a failed build is listed too, as "enabled: Plugin failed to build").
    # Only from inside a running Hyprland (as hyprfocus and Hyprspace): `hyprpm add` asks the running instance for
    # its version to pick the plugin commit that matches it; without one it builds the repo's latest, which may not
    # build against this Hyprland. On a new machine (--hyprland from GNOME): run the installer again inside Hyprland.
    skip_if: >-
      ! command -v hyprpm >/dev/null || [ -z "${HYPRLAND_INSTANCE_SIGNATURE:-}" ] ||
      hyprpm list 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | grep -A1 'Plugin hyprbars$' | grep -q 'enabled: true'
    # hyprpm builds against the system's Hyprland headers: on Ubuntu those of its libraries come from the same PPA,
    # they need C++23 (<print>), which Ubuntu 24.04's default g++ 13 lacks (so g++-14 there), and they include glslang
    # and lua 5.4 headers that the PPA's hyprland.pc doesn't list (so nothing adds lua's include dir: CPATH does).
    # Elsewhere the default g++, the one the PPA builds Hyprland with: a plugin from another g++ can crash Hyprland
    # as it loads (std::format's internals differ). hyprpm's build hash leaves the compiler out, so after an Ubuntu
    # upgrade it would keep the old build: update forces a rebuild when the plugin's g++ isn't today's.
    script: |
      set -e
      sudo apt-get install -y -qq g++-14 glslang-dev liblua5.4-dev libhyprutils-dev libaquamarine-dev libhyprlang-dev libhyprcursor-dev libhyprgraphics-dev libxcb-errors-dev
      CXX=g++; [ "$(g++ -dumpversion | cut -d. -f1)" -ge 14 ] || CXX=g++-14
      export CXX CPATH=/usr/include/lua5.4${CPATH:+:$CPATH}
      hyprpm update
      if hyprpm list 2>/dev/null | grep -q hyprland-plugins; then hyprpm update -f; else hyprpm add https://github.com/hyprwm/hyprland-plugins; fi
      hyprpm enable hyprbars
      hyprpm reload
      hyprpm list | sed 's/\x1b\[[0-9;]*m//g' | grep -A1 'Plugin hyprbars$' | grep -q 'enabled: true' ||
        { echo "hyprbars didn't build: 'hyprpm -v update -f' shows why"; exit 1; }
    update: |   # rebuilds it after a Hyprland update, or with -f after a compiler change
      command -v hyprpm >/dev/null || exit 0
      # hyprpm needs the running Hyprland (its version, and the reload): from another desktop, wait for a run inside it
      [ -n "${HYPRLAND_INSTANCE_SIGNATURE:-}" ] || { echo "hyprbars: Hyprland isn't running here; checked on a run inside it"; exit 0; }
      # its build packages too: an Ubuntu upgrade (or a Hyprland reinstall) can remove them
      missing=$(for p in g++-14 glslang-dev liblua5.4-dev libhyprutils-dev libaquamarine-dev libhyprlang-dev libhyprcursor-dev libhyprgraphics-dev libxcb-errors-dev; do
        dpkg-query -W -f='${db:Status-Abbrev}' "$p" 2>/dev/null | grep -q '^ii' || echo "$p"; done)
      [ -z "$missing" ] || { echo "hyprbars: installing" $missing; sudo apt-get install -y -qq $missing; }
      CXX=g++; [ "$(g++ -dumpversion | cut -d. -f1)" -ge 14 ] || CXX=g++-14
      so=/var/cache/hyprpm/$(id -un)/hyprland-plugins/hyprbars.so force=
      # .comment holds e.g. "GCC: (Ubuntu 14.2.0-4ubuntu2~24.04.1) 14.2.0"; --version the same from "("
      if [ ! -f "$so" ]; then
        echo "hyprbars isn't built (a failed build leaves none): rebuilding"; force=-f
      elif ! readelf -p .comment "$so" 2>/dev/null | grep -qF "$("$CXX" --version | head -1 | sed 's/^[^(]*//')"; then
        echo "hyprbars was built with another g++: rebuilding"; force=-f
      fi
      CXX=$CXX CPATH=/usr/include/lua5.4 hyprpm update $force
    uninstall: >-
      hyprpm disable hyprbars; hyprpm remove https://github.com/hyprwm/hyprland-plugins; hyprpm reload;
      sudo apt-get remove -y -qq g++-14 glslang-dev liblua5.4-dev libhyprutils-dev libaquamarine-dev libhyprlang-dev libhyprcursor-dev libhyprgraphics-dev libxcb-errors-dev
  - name: hyprfocus   # Hyprland: flash on the window that gets keyboard focus; settings in linux/hypr/dotfiles.lua
    when: desktop
    interactive: true   # hyprpm, as for hyprbars
    # the same hyprland-plugins repo as hyprbars (built and updated by its entry above): only enabled here.
    # Skipped where that repo isn't there (no hyprbars: its build failed, or no Hyprland)
    skip_if: >-
      ! command -v hyprpm >/dev/null || [ -z "${HYPRLAND_INSTANCE_SIGNATURE:-}" ] ||
      ! hyprpm list 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | grep -q 'Plugin hyprfocus$' ||
      hyprpm list 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | grep -A1 'Plugin hyprfocus$' | grep -q 'enabled: true'
    script: |
      set -e
      hyprpm enable hyprfocus
      [ -z "${HYPRLAND_INSTANCE_SIGNATURE:-}" ] || hyprpm reload
    uninstall: "! command -v hyprpm >/dev/null || { hyprpm disable hyprfocus; hyprpm reload; }"
  - name: hyprspace   # Hyprland workspace overview on tap-Super (drag windows between workspaces); settings in linux/hypr/dotfiles.lua
    when: desktop
    interactive: true   # hyprpm, as for hyprbars
    # Built like hyprbars (whose entry above installs the build packages and, on update, rebuilds every hyprpm plugin)
    skip_if: >-
      ! command -v hyprpm >/dev/null || [ -z "${HYPRLAND_INSTANCE_SIGNATURE:-}" ] ||
      hyprpm list 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | grep -A1 'Plugin Hyprspace$' | grep -q 'enabled: true'
    script: |
      set -e
      CXX=g++; [ "$(g++ -dumpversion | cut -d. -f1)" -ge 14 ] || CXX=g++-14
      export CXX CPATH=/usr/include/lua5.4${CPATH:+:$CPATH}
      hyprpm list 2>/dev/null | grep -q 'Repository Hyprspace' || hyprpm add https://github.com/KZDKM/Hyprspace
      hyprpm enable Hyprspace
      [ -z "${HYPRLAND_INSTANCE_SIGNATURE:-}" ] || hyprpm reload
      hyprpm list | sed 's/\x1b\[[0-9;]*m//g' | grep -A1 'Plugin Hyprspace$' | grep -q 'enabled: true' ||
        { echo "Hyprspace didn't build: 'hyprpm -v update -f' shows why"; exit 1; }
    uninstall: "! command -v hyprpm >/dev/null || { hyprpm disable Hyprspace; hyprpm remove https://github.com/KZDKM/Hyprspace; hyprpm reload; }"
  - name: wayle   # Hyprland panel (bar, notifications, OSD), tried in place of waybar: linux/hypr/panel.sh switches, config in linux/wayle
    when: desktop
    # Not packaged for Ubuntu: built from its latest release tag with cargo (Rust 1.93+: 26.04's cargo) into ~/.local
    skip_if: "[ -x ~/.local/bin/wayle ] || ! command -v Hyprland >/dev/null"
    script: |
      set -e
      sudo apt-get install -y -qq cargo pkg-config cmake clang build-essential libgtk-4-dev libgtk4-layer-shell-dev libgtksourceview-5-dev libpulse-dev libfftw3-dev libpipewire-0.3-dev libudev-dev
      tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
      tag=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/wayle-rs/wayle 'v*' | head -1 | sed 's|.*/||')
      git clone -q --depth 1 --branch "$tag" https://github.com/wayle-rs/wayle "$tmp/wayle"
      cd "$tmp/wayle"
      cargo install --locked --root ~/.local --path wayle
      cargo install --locked --root ~/.local --path crates/wayle-settings
      ~/.local/bin/wayle icons setup   # its icon set, into ~/.local/share/wayle/icons (needs the source tree)
    uninstall: >-
      { ~/.local/bin/wayle panel stop 2>/dev/null; true; } &&
      { cargo uninstall --root ~/.local wayle 2>/dev/null; cargo uninstall --root ~/.local wayle-settings 2>/dev/null; true; } &&
      rm -rf ~/.local/bin/wayle ~/.local/bin/wayle-settings ~/.local/share/wayle &&
      sudo apt-get remove -y -qq libgtksourceview-5-dev libfftw3-dev libpipewire-0.3-dev libpulse-dev
  - name: spotify   # Spotify's official app, from its snap (Spotify's own Linux package; snap keeps it updated)
    when: desktop
    skip_if: "! command -v snap >/dev/null || snap list spotify >/dev/null 2>&1"
    script: sudo snap install spotify
    uninstall: sudo snap remove spotify
  # COSMIC (System76's desktop), opt-in: ./install.cmd --cosmic. Chosen at the login screen next to GNOME and Hyprland.
  # Not packaged by Ubuntu or System76 for Ubuntu: from the community PPA hepp3n/cosmic-epoch (its key by fingerprint).
  # Its theme and keys: linux/cosmic. It brings its own panel, dock, launcher, switcher, overview and title bars.
  - name: cosmic-session
    when: cosmic
    repo:
      name: cosmic-epoch
      key: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xEB141BFC014828F92C2EF883210C6A47471454A0
      url: https://ppa.launchpadcontent.net/hepp3n/cosmic-epoch/ubuntu
  - name: wl-screenrec   # screen recording under COSMIC (linux/desktop/record.sh): wf-recorder needs wlroots' screencopy
    when: cosmic
    skip_if: "[ -x ~/.local/bin/wl-screenrec ]"
    script: |
      set -e
      sudo apt-get install -y -qq cargo pkg-config clang libdrm-dev libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libavdevice-dev libswscale-dev
      cargo install --locked --root ~/.local wl-screenrec
    update: "[ ! -x ~/.local/bin/wl-screenrec ] || cargo install --locked --root ~/.local wl-screenrec"   # a no-op when current
    uninstall: "{ cargo uninstall --root ~/.local wl-screenrec || rm -f ~/.local/bin/wl-screenrec; }"
  # COSMIC panel applets, put in the panel by COSMIC_KEYS in linux/install.sh (as wayle's cpu/ram and idle-inhibit).
  # System monitor (leonardo-panseri/cosmic-ext-applet-sysmon): CPU, RAM, GPU, disk and network as numbers in the
  # panel, details and graphs in its popup; right click opens btop (its process_monitor: COSMIC_KEYS). No package:
  # built with cargo at a pinned commit (bump COMMIT to update), into /usr/local, where the panel finds applets
  - name: cosmic-ext-applet-sysmon
    when: cosmic
    skip_if: "[ -x /usr/local/bin/cosmic-ext-applet-sysmon ]"
    script: |
      set -e
      COMMIT=3b8408e5a0dab4829f9f63e0a329de63be8ed19e
      ID=io.github.leonardo_panseri.cosmic-ext-applet-sysmon
      sudo apt-get install -y -qq cargo git pkg-config libwayland-dev libxkbcommon-dev
      tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
      git clone -q https://github.com/leonardo-panseri/cosmic-ext-applet-sysmon "$tmp/src"
      git -C "$tmp/src" checkout -q "$COMMIT"
      cargo build --release --locked --manifest-path "$tmp/src/Cargo.toml" --bin cosmic-ext-applet-sysmon
      sudo install -Dm755 "$tmp/src/target/release/cosmic-ext-applet-sysmon" /usr/local/bin/cosmic-ext-applet-sysmon
      # the desktop entry is generated by the build (build.rs)
      sudo install -Dm644 "$tmp/src/target/xdgen/app.desktop" "/usr/local/share/applications/$ID.desktop"
      sudo install -Dm644 "$tmp/src/resources/icon.svg" "/usr/local/share/icons/hicolor/scalable/apps/$ID.svg"
    uninstall: >-
      sudo rm -f /usr/local/bin/cosmic-ext-applet-sysmon
      /usr/local/share/applications/io.github.leonardo_panseri.cosmic-ext-applet-sysmon.desktop
      /usr/local/share/icons/hicolor/scalable/apps/io.github.leonardo_panseri.cosmic-ext-applet-sysmon.svg
  # Caffeine (Oussamaberchi/caffeine-cosmic): keep awake, no dimming, locking or sleep, with a timer. No package:
  # built with cargo at a pinned commit (bump COMMIT to update), into /usr/local, where the panel finds applets
  - name: cosmic-caffeine
    when: cosmic
    skip_if: "[ -x /usr/local/bin/cosmic-caffeine ]"
    script: |
      set -e
      COMMIT=83fdd939aead5fed81c5714825180468f5b86691
      sudo apt-get install -y -qq cargo git pkg-config libssl-dev libwayland-dev libxkbcommon-dev
      tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
      git clone -q https://github.com/Oussamaberchi/caffeine-cosmic "$tmp/src"
      git -C "$tmp/src" checkout -q "$COMMIT"
      # not --locked: the commit's Cargo.lock is out of date with its Cargo.toml; cargo updates only what it must
      cargo build --release --manifest-path "$tmp/src/Cargo.toml"
      sudo install -Dm755 "$tmp/src/target/release/cosmic-caffeine" /usr/local/bin/cosmic-caffeine
      sudo install -Dm644 "$tmp/src/assets/com.github.cosmic-caffeine.desktop" /usr/local/share/applications/com.github.cosmic-caffeine.desktop
      sudo install -Dm644 "$tmp/src/assets/oussama-berchi-caffeine-cosmic.svg" /usr/local/share/icons/hicolor/scalable/apps/oussama-berchi-caffeine-cosmic.svg
    uninstall: >-
      sudo rm -f /usr/local/bin/cosmic-caffeine /usr/local/share/applications/com.github.cosmic-caffeine.desktop
      /usr/local/share/icons/hicolor/scalable/apps/oussama-berchi-caffeine-cosmic.svg
  # pivot (Sigma-studios/pivot): Alt-Tab with live window previews under COSMIC; a quick tap flips to the previous
  # window, as in GNOME. Bound in linux/cosmic/shortcuts.ron (COSMIC's own switcher while pivot is missing), started at
  # login by linux/cosmic/pivot.desktop. Early software: built with cargo at a pinned commit (bump COMMIT and the one in
  # skip_if to update). skip_if reads cargo's record of the build, so another commit (or a local build) is rebuilt
  - name: pivot
    when: cosmic
    skip_if: >-
      [ -x ~/.local/bin/pivot ] &&
      cargo install --list --root ~/.local 2>/dev/null | grep -q '^pivot .*[?]rev=9da347027e97e94b3e5e3082ff0841745bd66cf6'
    script: |
      set -e
      COMMIT=9da347027e97e94b3e5e3082ff0841745bd66cf6
      sudo apt-get install -y -qq cargo git pkg-config libgbm-dev libxkbcommon-dev
      cargo install --locked --force --root ~/.local --git https://github.com/Sigma-studios/pivot --rev "$COMMIT" pivot
      ~/.local/bin/pivot quit 2>/dev/null || true   # the running daemon: the next Alt+Tab starts the new one
      rm -f "${XDG_STATE_HOME:-$HOME/.local/state}/dotfiles/pivot.build"   # an older recipe's build stamp
    uninstall: >-
      { cargo uninstall --root ~/.local pivot || rm -f ~/.local/bin/pivot; } &&
      rm -f "${XDG_STATE_HOME:-$HOME/.local/state}/dotfiles/pivot.build"
  # skwd-wall (liixini/skwd-wall): wallpaper picker under COSMIC (Super-W, linux/cosmic/shortcuts.ron), with a built-in
  # Wallhaven browser that downloads and applies. It draws the wallpaper itself (skwd-walld) over COSMIC's background.
  # Beta, and its Debian packages are new: the release's .debs, pinned with their sha256 (bump all four lines to
  # update). Its optional AI search models (~1 GB, Recommends) are left out. The package starts skwd-walld in every
  # graphical session; here it only starts with COSMIC's session (cosmic-session.target).
  - name: skwd-wall
    when: cosmic
    skip_if: "[ \"$(dpkg-query -W -f='${Version}' skwd-wall-v2 2>/dev/null)\" = 1.0.0~beta.29-1 ]"
    script: |
      set -e
      base=https://github.com/liixini/skwd-wall/releases/download/v1.0.0-beta.29
      tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
      cd "$tmp"
      while read -r sum f; do
        curl -fsSLO "$base/$f"
        echo "$sum  $f" | sha256sum -c --quiet
      done <<'EOF'
      50b07a0596841b8b6f0811f6f94251811807111cc0bf0ff4befcdeceec9b8b4c skwd-paper_1.0.0.beta.29-1_amd64.deb
      327838c321cb36311fb0f4ac86b02bad89d29f128bcb6da0cecf0c9012937eb9 skwd-deck_1.0.0.beta.29-1_amd64.deb
      657d4da55c406ee33e5da526ead5e9c7cd76442d38f212d6c9e637c2c25fcc1c skwd-wall-v2_1.0.0.beta.29-1_amd64.deb
      EOF
      sudo apt-get install -y -qq --no-install-recommends ./*.deb
      # not in every session (default.target, kept off through its upgrades): COSMIC's only (post)
      sudo systemctl --global disable skwd-walld.service
    post: |
      set -e
      systemctl --user show-environment >/dev/null 2>&1 || exit 0   # no systemd user manager here (e.g. ssh, container)
      systemctl --user add-wants cosmic-session.target skwd-walld.service
      if [ "$XDG_CURRENT_DESKTOP" = COSMIC ]; then systemctl --user start skwd-walld.service; fi
    uninstall: |
      systemctl --user disable --now skwd-walld.service 2>/dev/null || true
      sudo apt-get remove -y -qq skwd-wall-v2 skwd-deck skwd-paper
  - {name: slurp, when: desktop}   # picks the area for Ctrl-Alt-Shift-A screen recording (linux/desktop/record.sh)
  - {name: wf-recorder, when: desktop, skip_if: &no-hyprland '! command -v Hyprland >/dev/null && [ ! -e "${XDG_STATE_HOME:-$HOME/.local/state}/dotfiles/desktop-hyprland" ]'}   # Ctrl-Alt-Shift-R screen recording (linux/desktop/record.sh)
  # monitor layouts that switch by themselves on plug/unplug (docking). Profiles name this machine's screens, so they
  # live in the untracked ~/.config/kanshi/config; linux/hypr/dotfiles.lua starts kanshi only when that file exists
  - {name: kanshi, when: desktop, skip_if: *no-hyprland}
  # Japanese input under Hyprland and COSMIC (installed or chosen: --hyprland / --cosmic): fcitx5 + Mozc, Ctrl-Space (started by linux/hypr/dotfiles.lua, and under
  # COSMIC by linux/cosmic/fcitx5.desktop). GNOME keeps ibus (ibus-mozc below): with ibus installed, im-config's
  # automatic choice stays ibus. Only where Hyprland or COSMIC is.
  - {name: fcitx5, when: desktop, skip_if: &no-fcitx '! command -v Hyprland >/dev/null && ! command -v cosmic-session >/dev/null && [ ! -e "${XDG_STATE_HOME:-$HOME/.local/state}/dotfiles/desktop-hyprland" ] && [ ! -e "${XDG_STATE_HOME:-$HOME/.local/state}/dotfiles/desktop-cosmic" ]'}
  - {name: fcitx5-mozc, when: desktop, skip_if: *no-fcitx}
  # GTK 3/4 and Qt 5/6 modules, for XWayland and older apps. The metapackage itself: removing one of its parts
  # by name would make apt mark the other parts manual, and autoremove would leave them
  - {name: fcitx5-frontend-all, when: desktop, skip_if: *no-fcitx}
  - {name: fcitx5-config-qt, when: desktop, skip_if: *no-fcitx}       # fcitx5-configtool: input methods, keys
  # Japanese input under Ubuntu's GNOME: ibus + Mozc, Ctrl-Space too (input sources and key set by linux/install.sh)
  - {name: ibus-mozc, when: desktop, skip_if: '! command -v gnome-shell >/dev/null'}
  - name: hyprshell   # Hyprland Alt-Tab switcher + launcher; config in linux/hyprshell, started by linux/hypr/dotfiles.lua
    when: desktop
    # Needs GTK 4.18+, libadwaita 1.8+ and gtk4-layer-shell 1.1.1+ (Ubuntu 26.04 on), and Hyprland 0.57+ (it binds its
    # keys through the Lua config; Ubuntu 26.04's own Hyprland is 0.53, the PPA's is newer): skipped before, and the
    # rofi Alt-Tab/launcher stay. Built with cargo (Rust 1.92+; 26.04's cargo is 1.93) into ~/.local/bin.
    skip_if: >-
      [ -x ~/.local/bin/hyprshell ] || ! command -v Hyprland >/dev/null ||
      ! dpkg --compare-versions "$(Hyprland --version | awk 'NR == 1 {print $2}')" ge 0.57 ||
      dpkg --compare-versions "$(apt-cache policy libgtk-4-1 | awk '/Candidate:/ {print $2}')" lt 4.18   # the GTK apt offers
    script: |
      set -e
      sudo apt-get install -y -qq cargo pkg-config libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev
      cargo install --locked --root ~/.local hyprshell
    update: "[ ! -x ~/.local/bin/hyprshell ] || cargo install --locked --root ~/.local hyprshell"   # a no-op when current
    uninstall: >-
      { cargo uninstall --root ~/.local hyprshell || rm -f ~/.local/bin/hyprshell; } &&
      sudo apt-get remove -y -qq cargo libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev

  # dev
  - gh
  - git-delta
  - shellcheck
  - jq
  - yq
  - cloc
  - name: lazygit
    github: jesseduffield/lazygit
    asset: lazygit_{version}_linux_{xarch}.tar.gz
  - name: code
    when: desktop
    repo:
      name: vscode
      key: https://packages.microsoft.com/keys/microsoft.asc
      url: https://packages.microsoft.com/repos/code
      suite: stable

  # infra
  - ansible
  - kubectx
  - name: kubectl
    script: |
      curl -fsSLo ~/.local/bin/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/$(dpkg --print-architecture)/kubectl"
      chmod +x ~/.local/bin/kubectl
    uninstall: rm -f ~/.local/bin/kubectl
  - name: helm
    script: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | HELM_INSTALL_DIR=~/.local/bin USE_SUDO=false bash >/dev/null
    uninstall: rm -f ~/.local/bin/helm
  - name: k9s
    github: derailed/k9s
    asset: k9s_Linux_{arch}.tar.gz
  - name: stern
    github: stern/stern
    asset: stern_{version}_linux_{arch}.tar.gz
  - name: terraform
    repo:
      name: hashicorp
      key: https://apt.releases.hashicorp.com/gpg
      url: https://apt.releases.hashicorp.com
  - name: aws
    script: |
      tmp=$(mktemp -d)
      curl -fsSLo "$tmp/aws.zip" "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip"
      unzip -q "$tmp/aws.zip" -d "$tmp"
      "$tmp/aws/install" -i ~/.local/share/aws-cli -b ~/.local/bin >/dev/null
      command rm -rf "$tmp"
    uninstall: rm -rf ~/.local/share/aws-cli ~/.local/bin/aws ~/.local/bin/aws_completer
  # Ubuntu's Docker; skipped when Docker CE/Desktop already provides docker (the packages conflict)
  - name: docker.io
    skip_if: &other-docker command -v docker >/dev/null && ! dpkg -s docker.io >/dev/null 2>&1
    post: id -nG | grep -qw docker || sudo usermod -aG docker "$USER"   # no sudo for docker (next login)
  - name: docker-compose-v2
    skip_if: *other-docker
  - name: docker-buildx
    skip_if: *other-docker

  # network
  - httpie
  - name: xh
    github: ducaale/xh
    asset: xh-{tag}-{m}-unknown-linux-musl.tar.gz
    file: xh-{tag}-{m}-unknown-linux-musl/xh
    post: '[ -e ~/.local/bin/ht ] || ln -s xh ~/.local/bin/ht'
    uninstall: rm -f ~/.local/bin/xh ~/.local/bin/ht
  - libcap2-bin  # setcap for bandwhich
  - gping        # ping, graphed
  - name: doggo  # dig
    github: mr-karan/doggo
    asset: doggo-linux-{m}.tar.gz
  - name: bandwhich # iftop, per process
    github: imsnif/bandwhich
    asset: bandwhich-{tag}-{m}-unknown-linux-musl.tar.gz
    post: getcap ~/.local/bin/bandwhich | grep -q cap_net_admin || sudo setcap cap_sys_ptrace,cap_dac_read_search,cap_net_raw,cap_net_admin+ep ~/.local/bin/bandwhich
  - nmap
  - tcpdump
  - tshark
  - termshark
  - mtr-tiny
  - iperf3
  - bind9-dnsutils
  - ipcalc
  - tcptraceroute
  - whois
  - bgpq4
  - socat

  # python: pyenv build deps, then pyenv with 3.11, 3.12 (global unless you picked one) and 3.14
  - python3
  - python3-yaml
  - virtualenvwrapper
  - build-essential
  - libssl-dev
  - zlib1g-dev
  - libbz2-dev
  - libreadline-dev
  - libsqlite3-dev
  - libncurses-dev
  - xz-utils
  - tk-dev
  - libxml2-dev
  - libxmlsec1-dev
  - libffi-dev
  - liblzma-dev
  - name: uv
    script: curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh >/dev/null
    uninstall: rm -f ~/.local/bin/uv ~/.local/bin/uvx
  - name: pyenv
    skip_if: test -d ~/.pyenv
    script: git clone -q https://github.com/pyenv/pyenv.git ~/.pyenv
    update: git -C ~/.pyenv pull -q --ff-only
    post: |
      export PYENV_ROOT=~/.pyenv; pyenv=~/.pyenv/bin/pyenv
      for v in 3.11 3.12 3.14; do
        v=$("$pyenv" latest -k "$v")
        [ -d ~/.pyenv/versions/"$v" ] || { echo "python $v (builds from source, a few minutes)"; "$pyenv" install -s "$v"; }
      done
      [ "$("$pyenv" global)" != system ] || "$pyenv" global "$("$pyenv" latest 3.12)"
    uninstall: rm -rf ~/.pyenv   # also deletes every pyenv Python and virtualenv
    tools:
      - ptpython   # nicer Python REPLs (aliases ptpy, bpy in linux/zsh/zsh_aliases)
      - bpython

  # ruby: rbenv + ruby-build with 3.2 (EOL 2026-03), 3.4 (global unless you picked one) and 4.0
  - autoconf
  - patch
  - libyaml-dev
  - libgmp-dev
  - libgdbm-dev
  - uuid-dev
  - name: rbenv
    skip_if: test -d ~/.rbenv
    script: |
      git clone -q https://github.com/rbenv/rbenv.git ~/.rbenv
      git clone -q https://github.com/rbenv/ruby-build.git ~/.rbenv/plugins/ruby-build
    update: git -C ~/.rbenv pull -q --ff-only && git -C ~/.rbenv/plugins/ruby-build pull -q --ff-only
    post: |
      export RBENV_ROOT=~/.rbenv; rbenv=~/.rbenv/bin/rbenv
      for s in 3.2 3.4 4.0; do
        v=$("$rbenv" install -L 2>/dev/null | tr -d ' ' | grep -E "^$s\.[0-9]+$" | sort -V | tail -1)
        [ -n "$v" ] || { echo "no Ruby $s release found"; continue; }
        [ -d ~/.rbenv/versions/"$v" ] || { echo "ruby $v (builds from source, a few minutes)"; "$rbenv" install -s "$v"; }
      done
      [ "$("$rbenv" global)" != system ] || "$rbenv" global "$(ls ~/.rbenv/versions | grep '^3\.4\.' | sort -V | tail -1)"
    uninstall: rm -rf ~/.rbenv   # also deletes every rbenv Ruby and its gems


  # go: official release in /usr/local/go (GOROOT), upgraded to the latest on each run.
  # Older/newer toolchains per project come from go.mod's `toolchain` line (Go downloads them itself).
  - name: go
    skip_if: test -x /usr/local/go/bin/go
    script: &go-latest |
      v=$(curl -fsSL 'https://go.dev/VERSION?m=text' | head -1)
      [ "$(/usr/local/go/bin/go env GOVERSION 2>/dev/null)" = "$v" ] && exit 0
      echo "go $v"
      tmp=$(mktemp)
      curl -fsSLo "$tmp" "https://go.dev/dl/$v.linux-$(dpkg --print-architecture).tar.gz"
      sudo rm -rf /usr/local/go && sudo tar -C /usr/local -xzf "$tmp"
      rm -f "$tmp"
    update: *go-latest
    uninstall: sudo rm -rf /usr/local/go
    tools:
      - golang.org/x/tools/gopls   # Go language server for vim-go and VS Code's Go extension

  # node
  - name: nvm
    skip_if: test -d ~/.nvm
    script: |
      git clone -q https://github.com/nvm-sh/nvm.git ~/.nvm
      git -C ~/.nvm -c advice.detachedHead=false checkout -q "$(git -C ~/.nvm describe --abbrev=0 --tags --match 'v[0-9]*' "$(git -C ~/.nvm rev-list --tags --max-count=1)")"
    uninstall: rm -rf ~/.nvm

  # AI CLIs (desktop apps are in the windows list)
  - name: claude
    script: curl -fsSL https://claude.ai/install.sh | bash >/dev/null
    uninstall: rm -rf ~/.local/bin/claude ~/.local/share/claude
  - name: codex
    github: openai/codex
    asset: codex-{m}-unknown-linux-musl.tar.gz
    file: codex-{m}-unknown-linux-musl
  - name: opencode
    script: curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path >/dev/null
    uninstall: rm -rf ~/.opencode

windows:
  # Wireshark/Nmap: the free Npcap installer can't run silently, so its setup window may appear
  - Git.Git
  - Microsoft.WindowsTerminal
  - Microsoft.VisualStudioCode
  - id: DEVCOM.JetBrainsMonoNerdFont
    font: JetBrainsMonoNerdFont
  - AmN.yasb
  - Microsoft.PowerToys
  - 9P7KNL5RWT25   # Sysinternals Suite from the Microsoft Store: the winget one fails its hash check whenever Microsoft
                   # updates the unversioned zip before the manifest, and the Store copy updates itself
  - voidtools.Everything
  - WiresharkFoundation.Wireshark
  - Insecure.Nmap
  - Anthropic.Claude
  - Anomaly.OpenCode.Desktop
