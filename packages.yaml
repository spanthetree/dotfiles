  # Ubuntu's Docker; skipped when Docker CE/Desktop already provides docker (the packages conflict)
  - name: docker.io
    skip_if: &other-docker command -v docker >/dev/null && ! dpkg -s docker.io >/dev/null 2>&1
    post: id -nG | grep -qw docker || sudo usermod -aG docker "$USER"   # no sudo for docker (next login)
  - name: docker-compose-v2
    skip_if: *other-docker
  - name: docker-buildx
    skip_if: *other-docker
  # containerlab: network labs (SR Linux, cEOS, FRR, Linux...) as containers, wired from a topology file. Its .deb
  # from the release (its apt repo is unsigned, trusted=yes). Router images are pulled per lab; some (cEOS) need a
  # vendor login. The package makes the clab_admins group: you're added, so it runs without sudo (next login)
  - name: containerlab
    skip_if: dpkg -s containerlab >/dev/null 2>&1
    script: &containerlab |   # also its update: a no-op when it's the latest release
      set -e
      tag=$(curl -fsSLo /dev/null -w '%{url_effective}' https://github.com/srl-labs/containerlab/releases/latest | sed 's|.*/||')
      [ "$(dpkg-query -W -f='${Version}' containerlab 2>/dev/null)" = "${tag#v}" ] && exit 0
      tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT; chmod 755 "$tmp"   # apt's _apt user reads the .deb
      curl -fsSLo "$tmp/clab.deb" "https://github.com/srl-labs/containerlab/releases/download/$tag/containerlab_${tag#v}_linux_$(dpkg --print-architecture).deb"
      sudo apt-get install -y -qq "$tmp/clab.deb"
      "$DOT/linux/apt-deps" own containerlab
    update: *containerlab
    post: "! getent group clab_admins >/dev/null || id -nG \"$USER\" | grep -qw clab_admins || sudo usermod -aG clab_admins \"$USER\""
    uninstall: |   # out of clab_admins too (the group goes with the package)
      ! id -nG "$USER" | grep -qw clab_admins || sudo gpasswd -d "$USER" clab_admins >/dev/null
      "$DOT/linux/apt-deps" remove containerlab

  # network
  - name: xh
    github: ducaale/xh
    asset: xh-{tag}-{m}-unknown-linux-musl.tar.gz
    file: xh-{tag}-{m}-unknown-linux-musl/xh
    post: '[ -e ~/.local/bin/ht ] || ln -s xh ~/.local/bin/ht'
    uninstall: rm -f ~/.local/bin/xh ~/.local/bin/ht
  - libcap2-bin  # setcap for trip
  - gping        # ping, graphed
  - name: trip   # trippy: mtr/traceroute with AS names and a map; config in linux/trippy, `trip` function in zshrc
    github: fujiapple852/trippy
    asset: trippy-{version}-{m}-unknown-linux-musl.tar.gz
    file: trippy-{version}-{m}-unknown-linux-musl/trip
    skip_if: test -x ~/.local/bin/trip   # ours, even where another trip (e.g. cargo's) is on PATH
    # raw sockets without sudo; the cap is lost when the binary is replaced, so check each run
    post: getcap ~/.local/bin/trip | grep -q cap_net_raw || sudo setcap cap_net_raw+ep ~/.local/bin/trip
  - geoipupdate  # MaxMind's GeoLite2 City for trip's map; the installer asks for a free license key once
  - name: doggo  # dig
    github: mr-karan/doggo
    asset: doggo-linux-{m}.tar.gz
  - name: rustnet  # network monitor TUI, connections per process. Its package sets the capabilities it needs
    repo:
      name: rustnet
      key: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x02E6E9053D5D53D9A85E142C2985E57C5DF10033
      url: https://ppa.launchpadcontent.net/domcyrus/rustnet/ubuntu
  - name: sshs     # pick a host from ~/.ssh/config; SynthWave colours via the alias in linux/zsh/zsh_aliases
    github: quantumsheep/sshs
    asset: sshs-linux-{arch}
    skip_if: test -x ~/.local/bin/sshs   # ours, even where a .deb's /usr/bin/sshs exists
  - name: termscp  # TUI file transfer: SFTP, SCP, FTP, S3, SMB, WebDAV; theme in linux/termscp
    github: veeso/termscp
    asset: termscp-{tag}-{m}-unknown-linux-musl.tar.gz
    skip_if: test -x ~/.local/bin/termscp
  - nmap
  - tcpdump
  - tshark
  - termshark
  - mtr-tiny
  - iperf3
  - bind9-dnsutils
  - ipcalc
  - whois
  - bgpq4
  - socat
  - asn          # AS, prefixes, peers, geolocation, reputation for an IP/ASN/domain; trace with AS names
  - name: globalping   # ping/traceroute/mtr/dig/http from probes worldwide (`globalping auth login` for higher limits)
    github: jsdelivr/globalping-cli
    asset: globalping_Linux_{xarch}.tar.gz
  - name: monocle      # BGP: MRT parsing, search updates, RPKI, AS-to-name, as2rel
    github: bgpkit/monocle
    asset: monocle-{m}-unknown-linux-gnu.tar.gz
  - name: gnmic        # gNMI client: get/set/subscribe on routers, switches
    github: openconfig/gnmic
    asset: gnmic_{version}_Linux_{m}.tar.gz
  - lldpd        # LLDP/CDP neighbours: `lldpcli show neighbors` (runs as a service)
  # scanning
  - name: rustscan     # fast port discovery, then nmap on what's open. Its release is a tar.gz inside a zip
    skip_if: test -x ~/.local/bin/rustscan
    script: &rustscan |   # also its update: a no-op when it's the latest release
      set -e
      tag=$(curl -fsSLo /dev/null -w '%{url_effective}' https://github.com/bee-san/RustScan/releases/latest | sed 's|.*/||')
      [ "$(~/.local/bin/rustscan --version 2>/dev/null)" = "rustscan ${tag#v}" ] && exit 0
      tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
      curl -fsSLo "$tmp/r.zip" "https://github.com/bee-san/RustScan/releases/download/$tag/$(uname -m)-linux-rustscan.tar.gz.zip"
      unzip -q "$tmp/r.zip" -d "$tmp" && tar -xzf "$tmp/$(uname -m)-linux-rustscan.tar.gz" -C "$tmp"
      install -m 755 "$tmp/rustscan" ~/.local/bin/rustscan
    update: *rustscan
    uninstall: rm -f ~/.local/bin/rustscan
  - name: nmap-formatter   # nmap XML to HTML, CSV, Markdown, JSON, D2, Graphviz
    github: vdjagilev/nmap-formatter
    asset: nmap-formatter-linux-{arch}.tar.gz
  - arp-scan     # who's on this LAN (sudo arp-scan -l)
  - fping        # ping many hosts / a subnet at once (fping -g 10.0.0.0/24)
  - hping3       # crafted TCP/UDP/ICMP probes
  - scamper      # bulk traceroute/ping measurement
  - grepcidr     # grep lines by IP in CIDRs
  - name: mapcidr      # CIDR maths: split, aggregate, count, expand
    github: projectdiscovery/mapcidr
    asset: mapcidr_{version}_linux_{arch}.zip
  # capture and kernel
  - ngrep        # grep for packets
  - tcpflow      # TCP streams to files
  - conntrack    # conntrack-tools: netfilter connection table
  - ethtool
  - pwru         # which kernel function drops a packet (eBPF)
  - bpftrace     # eBPF one-liners
  - bpfcc-tools  # BCC's tools: tcpconnect-bpfcc, tcplife-bpfcc, tcpretrans-bpfcc, execsnoop-bpfcc...
  # HTTP
  - name: oha    # HTTP load test with a live TUI
    github: hatoo/oha
    asset: oha-linux-{arch}

  # python: pyenv build deps, then pyenv with 3.11, 3.12 (global unless you picked one) and 3.14
  - python3
  - python3-yaml
  - virtualenvwrapper
  - build-essential
  - libssl-dev
  - zlib1g-dev
  - libbz2-dev
  - libreadline-dev
  - libsqlite3-dev
  - libncurses-dev
  - xz-utils
  - tk-dev
  - libxml2-dev
  - libxmlsec1-dev
  - libffi-dev
  - liblzma-dev
  - name: uv
    script: curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh >/dev/null
    uninstall: rm -f ~/.local/bin/uv ~/.local/bin/uvx
  - name: pyenv
    skip_if: test -d ~/.pyenv
    script: git clone -q https://github.com/pyenv/pyenv.git ~/.pyenv
    update: git -C ~/.pyenv pull -q --ff-only
    post: |
      export PYENV_ROOT=~/.pyenv; pyenv=~/.pyenv/bin/pyenv
      for v in 3.11 3.12 3.14; do
        v=$("$pyenv" latest -k "$v")
        [ -d ~/.pyenv/versions/"$v" ] || { echo "python $v (builds from source, a few minutes)"; "$pyenv" install -s "$v"; }
      done
      [ "$("$pyenv" global)" != system ] || "$pyenv" global "$("$pyenv" latest 3.12)"
    uninstall: rm -rf ~/.pyenv   # also deletes every pyenv Python and virtualenv
    tools:
      - ptpython   # nicer Python REPLs (aliases ptpy, bpy in linux/zsh/zsh_aliases)
      - bpython
      - httpstat   # curl with a timing breakdown: DNS, connect, TLS, server, transfer
  # SuzieQ: polls network devices over SSH into a queryable store (suzieq-cli, suzieq-gui). Not a `tools:` entry:
  # it needs Python 3.10-3.11 and uvloop, which it doesn't declare. Config: linux/suzieq (configure_suzieq in
  # linux/install.sh); sq-poller function in zshrc
  - name: suzieq
    skip_if: ~/.local/bin/uv tool list | grep -q '^suzieq '
    script: ~/.local/bin/uv tool install -q --python '>=3.10,<3.12' suzieq --with uvloop
    update: ~/.local/bin/uv tool upgrade -q suzieq
    uninstall: ~/.local/bin/uv tool uninstall suzieq
  # TTP (template-based parsing of CLI output) with ntc-templates (TextFSM templates for show commands) in its env.
  # ntc-templates has no command: the `ntc` function in zshrc parses with it
  - name: ttp
    skip_if: ~/.local/bin/uv tool list | grep -q '^ttp '
    script: ~/.local/bin/uv tool install -q ttp --with ntc-templates
    update: ~/.local/bin/uv tool upgrade -q ttp
    uninstall: ~/.local/bin/uv tool uninstall ttp

  # ruby: rbenv + ruby-build with 3.2 (EOL 2026-03), 3.4 (global unless you picked one) and 4.0
  - autoconf
  - patch
  - libyaml-dev
  - libgmp-dev
  - libgdbm-dev
  - uuid-dev
  - name: rbenv
    skip_if: test -d ~/.rbenv
    script: |
      git clone -q https://github.com/rbenv/rbenv.git ~/.rbenv
      git clone -q https://github.com/rbenv/ruby-build.git ~/.rbenv/plugins/ruby-build
    update: git -C ~/.rbenv pull -q --ff-only && git -C ~/.rbenv/plugins/ruby-build pull -q --ff-only
    post: |
      export RBENV_ROOT=~/.rbenv; rbenv=~/.rbenv/bin/rbenv
      for s in 3.2 3.4 4.0; do
        v=$("$rbenv" install -L 2>/dev/null | tr -d ' ' | grep -E "^$s\.[0-9]+$" | sort -V | tail -1)
        [ -n "$v" ] || { echo "no Ruby $s release found"; continue; }
        [ -d ~/.rbenv/versions/"$v" ] || { echo "ruby $v (builds from source, a few minutes)"; "$rbenv" install -s "$v"; }
      done
      [ "$("$rbenv" global)" != system ] || "$rbenv" global "$(ls ~/.rbenv/versions | grep '^3\.4\.' | sort -V | tail -1)"
    uninstall: rm -rf ~/.rbenv   # also deletes every rbenv Ruby and its gems


  # go: official release in /usr/local/go (GOROOT), upgraded to the latest on each run.
  # Older/newer toolchains per project come from go.mod's `toolchain` line (Go downloads them itself).
  - name: go
    skip_if: test -x /usr/local/go/bin/go
    script: &go-latest |
      v=$(curl -fsSL 'https://go.dev/VERSION?m=text' | head -1)
      [ "$(/usr/local/go/bin/go env GOVERSION 2>/dev/null)" = "$v" ] && exit 0
      echo "go $v"
      tmp=$(mktemp)
      curl -fsSLo "$tmp" "https://go.dev/dl/$v.linux-$(dpkg --print-architecture).tar.gz"
      sudo rm -rf /usr/local/go && sudo tar -C /usr/local -xzf "$tmp"
      rm -f "$tmp"
    update: *go-latest
    uninstall: sudo rm -rf /usr/local/go
    tools:
      - golang.org/x/tools/gopls   # Go language server for vim-go and VS Code's Go extension

  # node
  - name: nvm
    skip_if: test -d ~/.nvm
    script: |
      git clone -q https://github.com/nvm-sh/nvm.git ~/.nvm
      git -C ~/.nvm -c advice.detachedHead=false checkout -q "$(git -C ~/.nvm describe --abbrev=0 --tags --match 'v[0-9]*' "$(git -C ~/.nvm rev-list --tags --max-count=1)")"
    uninstall: rm -rf ~/.nvm

  # notes: Joplin. Markdown notes and to-dos, synced through Joplin Cloud, OneDrive, Dropbox, Nextcloud/WebDAV or S3
  # (end-to-end encryption optional). Set the same sync target in each app: `joplin config sync.target` in the CLI.
  # The terminal app (`joplin`) is an npm package: it gets its own Node LTS in ~/.local/share/joplin-cli (Ubuntu
  # 24.04's Node 18 is too old for it, and nvm's versions come and go); Node needs libatomic1
  - libatomic1
  - name: joplin
    skip_if: test -x ~/.local/share/joplin-cli/bin/joplin
    script: &joplin-cli |   # also its update: Node and Joplin are only fetched when newer
      set -e
      d=~/.local/share/joplin-cli
      v=$(curl -fsSL https://nodejs.org/dist/index.json | python3 -c 'import json, sys; print(next(r["version"] for r in json.load(sys.stdin) if r["lts"]))')
      a=$(dpkg --print-architecture | sed 's/amd64/x64/')
      if [ "$("$d/node/bin/node" --version 2>/dev/null)" != "$v" ]; then
        tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
        curl -fsSL "https://nodejs.org/dist/$v/node-$v-linux-$a.tar.xz" | tar -xJ -C "$tmp"
        rm -rf "$d/node" && mkdir -p "$d" && mv "$tmp/node-$v-linux-$a" "$d/node"
      fi
      export PATH=$d/node/bin:$PATH
      have=$(node -p 'require(process.argv[1]).version' "$d/lib/node_modules/joplin/package.json" 2>/dev/null || true)
      [ "$have" = "$(npm view joplin version)" ] || npm install -g -s --prefix "$d" joplin@latest >/dev/null
      printf '#!/bin/sh\nPATH=%s/node/bin:$PATH exec %s/bin/joplin "$@"\n' "$d" "$d" >| ~/.local/bin/joplin
      chmod +x ~/.local/bin/joplin
    update: *joplin-cli
    uninstall: rm -rf ~/.local/share/joplin-cli ~/.local/bin/joplin   # notes stay in ~/.config/joplin
  - {name: libfuse2t64, when: desktop}   # AppImages (Joplin's desktop app) need FUSE 2
  - name: joplin-desktop   # Joplin's own installer: AppImage in ~/.joplin, menu entry, icon; re-run, it updates
    when: desktop
    skip_if: test -x ~/.joplin/Joplin.AppImage
    script: &joplin-desktop curl -fsSL https://raw.githubusercontent.com/laurent22/joplin/dev/Joplin_install_and_update.sh | bash -s -- --silent
    update: *joplin-desktop
    uninstall: >-   # notes stay in ~/.config/joplin-desktop
      rm -rf ~/.joplin ~/.local/share/applications/appimagekit-joplin.desktop
      ~/.local/share/icons/hicolor/512x512/apps/joplin.png

  # AI CLIs (desktop apps are in the windows list)
  - name: claude
    script: curl -fsSL https://claude.ai/install.sh | bash >/dev/null
    uninstall: rm -rf ~/.local/bin/claude ~/.local/share/claude
  - name: codex
    github: openai/codex
    asset: codex-{m}-unknown-linux-musl.tar.gz
    file: codex-{m}-unknown-linux-musl
  - name: opencode
    script: curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path >/dev/null
    uninstall: rm -rf ~/.opencode

windows:
  # Wireshark/Nmap: the free Npcap installer can't run silently, so its setup window may appear
  - Git.Git
  - Microsoft.WindowsTerminal
  - Microsoft.VisualStudioCode
  - id: DEVCOM.JetBrainsMonoNerdFont
    font: JetBrainsMonoNerdFont
  - AmN.yasb
  - Microsoft.PowerToys
  - 9P7KNL5RWT25   # Sysinternals Suite from the Microsoft Store: the winget one fails its hash check whenever Microsoft
                   # updates the unversioned zip before the manifest, and the Store copy updates itself
  - voidtools.Everything
  - WiresharkFoundation.Wireshark
  - Insecure.Nmap
