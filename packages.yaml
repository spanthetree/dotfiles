# Packages for every machine. Edit this file, then re-run the installer:
#   linux:   ~/dotfiles/install.sh   (Debian/Ubuntu; also installs the windows list under WSL)
#   windows: install.ps1
#
# A plain string is a package name: apt package (linux) or winget id (windows).
# A map adds options. Linux keys (all optional except name):
#   repo:    extra apt source, refreshed every run (keys rotate):
#            {name, key: <gpg key url>, url: <deb url>, suite: <default: distro codename>, components: <default: main>}
#   github:  owner/repo; installs a binary from the latest release into ~/.local/bin, and updates it on later runs
#            asset: release file name (.tar.gz/.tar.xz/.zip, or the bare binary)
#            file: path of the binary inside the archive (default: name)
#   script:  shell that installs it
#   skip_if: shell test; when it succeeds the install is skipped
#            (default for github/script: the command <name> exists)
#   update:  shell run on every run when already installed
#   post:    shell run on every run after installing
#   when:    desktop | wsl; install only on such machines
#   interactive: true runs script/update/post/uninstall in the terminal, without the spinner, so a prompt
#            the step can't avoid (e.g. a tool that runs sudo itself and asks again) is seen and answered
#   tools:   (go, pyenv, rbenv entries only) tools installed with that language's own installer, after it.
#            Each is a name, or {name, version}. Removing a line uninstalls that tool.
#              go:    go install <module path>@<version, default latest>   -> ~/go/bin
#              pyenv: uv tool install <name><version, e.g. '>=24'>         -> ~/.local/bin, isolated env per tool
#              rbenv: gem install <name> -v <version, e.g. '~> 8.0'>      -> rbenv's global Ruby
#   uninstall: shell that removes it (default: apt remove for apt, delete ~/.local/bin/<name> for github;
#            script installs without one are only warned about)
# Placeholders in asset/file: {tag} v1.2.3, {version} 1.2.3, {arch} amd64/arm64,
#   {m} x86_64/aarch64, {xarch} x86_64/arm64
# Windows keys: id; font: font file prefix (a hand-installed font isn't listed by winget).
#
# Removing: delete the entry and re-run. The installer uninstalls it (after asking) if it installed it on this
# machine. `install.sh --adopt` once treats everything already installed from this list as its own.

settings:
  autoremove: true   # after uninstalling apt packages, also `apt-get autoremove` their leftover dependencies
  upgrade: true      # each run also `apt-get upgrade`s the whole system (GitHub binaries update to their latest release regardless)

linux:
  # base
  - git
  - curl
  - ca-certificates
  - gnupg
  - gpg
  - openssl
  - unzip
  - xclip

  # shell and editor
  - zsh
  - byobu
  - tmux
  - vim
  - fzf
  - ripgrep
  - fd-find
  - zoxide
  - eza
  - bat
  - direnv
  - btop
  - ncdu
  - name: tealdeer
    post: '[ -d ~/.cache/tealdeer ] || tldr --update >/dev/null 2>&1 || true'
  - name: starship
    script: curl -fsSL https://starship.rs/install.sh | sh -s -- -y -b ~/.local/bin >/dev/null
    uninstall: rm -f ~/.local/bin/starship

  # modern replacements for classic tools (old one in the comment)
  - duf          # df
  - gdu          # ncdu, faster
  - sd           # sed find/replace
  - hexyl        # xxd/hexdump
  - hyperfine    # time, benchmarking
  - entr         # rerun on file change
  - just         # make, as a task runner
  - name: dust   # du
    github: bootandy/dust
    asset: dust-{tag}-{m}-unknown-linux-musl.tar.gz
    file: dust-{tag}-{m}-unknown-linux-musl/dust
  - name: yazi   # file manager
    github: sxyazi/yazi
    asset: yazi-{m}-unknown-linux-musl.zip
    file: yazi-{m}-unknown-linux-musl/yazi
  - name: broot  # tree/cd navigator
    github: Canop/broot
    asset: broot_{version}.zip
    file: '{m}-unknown-linux-musl/broot'
  - name: ouch   # tar/zip/unzip
    github: ouch-org/ouch
    asset: ouch-{m}-unknown-linux-musl.tar.gz
    file: ouch-{m}-unknown-linux-musl/ouch
  - name: choose # cut / awk '{print $2}'
    github: theryangeary/choose
    asset: choose-{m}-unknown-linux-musl
  - libxcb-render0 # jless links these (clipboard)
  - libxcb-shape0
  - libxcb-xfixes0
  - name: jless  # JSON viewer (x86_64 only)
    github: PaulJuliusMartinez/jless
    asset: jless-{tag}-{m}-unknown-linux-gnu.zip
  - name: fx     # JSON viewer
    github: antonmedv/fx
    asset: fx_linux_{arch}
  - name: difft  # difftastic: structural diff
    github: Wilfred/difftastic
    asset: difft-{version}-{m}-unknown-linux-musl.tar.gz
  - name: procs  # ps
    github: dalance/procs
    asset: procs-{tag}-{m}-linux.zip
  - name: viddy  # watch
    github: sachaos/viddy
    asset: viddy-{tag}-linux-{m}.tar.gz
  - name: watchexec # rerun on file change
    github: watchexec/watchexec
    asset: watchexec-{version}-{m}-unknown-linux-gnu.tar.xz
    file: watchexec-{version}-{m}-unknown-linux-gnu/watchexec
  - name: scc    # cloc/tokei (tokei has no recent release binaries)
    github: boyter/scc
    asset: scc_Linux_{xarch}.tar.gz

  - name: terminator   # terminal emulator; config in linux/terminator
    when: desktop
  - name: fontconfig   # fc-cache, for the fonts below
    when: desktop
  - name: jetbrainsmono-nerd-font   # Terminator's font; starship icons need a Nerd Font
    when: desktop
    skip_if: test -d ~/.local/share/fonts/JetBrainsMonoNerdFont
    script: |
      set -eo pipefail
      tmp=$(mktemp -d) && mkdir -p ~/.local/share/fonts
      curl -fsSL https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.tar.xz | tar -xJ -C "$tmp"
      mv "$tmp" ~/.local/share/fonts/JetBrainsMonoNerdFont  # only once complete: skip_if tests this dir
      fc-cache -f ~/.local/share/fonts
    uninstall: rm -rf ~/.local/share/fonts/JetBrainsMonoNerdFont && { ! command -v fc-cache >/dev/null || fc-cache -f; }   # fontconfig may be removed first
  - name: kitty   # terminal emulator; config in linux/kitty (dotfiles.conf: byobu keys, theme.conf: the look)
    when: desktop
  - name: fantasquesansmono-nerd-font   # kitty's font (linux/kitty/theme.conf)
    when: desktop
    # a Hyprland desktop setup may have installed it already (its own copy and its own uninstall): then skipped
    skip_if: test -d ~/.local/share/fonts/FantasqueSansMNerdFont || fc-list | grep -q 'FantasqueSansM Nerd Font Mono'
    script: |
      set -eo pipefail
      tmp=$(mktemp -d) && mkdir -p ~/.local/share/fonts
      curl -fsSL https://github.com/ryanoasis/nerd-fonts/releases/latest/download/FantasqueSansMono.tar.xz | tar -xJ -C "$tmp"
      mv "$tmp" ~/.local/share/fonts/FantasqueSansMNerdFont  # only once complete: skip_if tests this dir
      fc-cache -f ~/.local/share/fonts
    uninstall: rm -rf ~/.local/share/fonts/FantasqueSansMNerdFont && { ! command -v fc-cache >/dev/null || fc-cache -f; }   # fontconfig may be removed first
  - name: hyprbars   # Hyprland title bars: drag to move, minimize/maximize/close; settings in linux/hypr/dotfiles.lua
    when: desktop
    interactive: true   # hyprpm runs sudo itself, and can ask for the password again
    # installed = built and enabled (a failed build is listed too, as "enabled: Plugin failed to build")
    skip_if: >-
      ! command -v hyprpm >/dev/null ||
      hyprpm list 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | grep -A1 'Plugin hyprbars$' | grep -q 'enabled: true'
    # hyprpm builds against the system's Hyprland headers: on Ubuntu those of its libraries come from the same PPA,
    # they need C++23 (<print>), which Ubuntu 24.04's default g++ 13 lacks (so g++-14 there), and they include glslang
    # and lua 5.4 headers that the PPA's hyprland.pc doesn't list (so nothing adds lua's include dir: CPATH does).
    # Elsewhere the default g++, the one the PPA builds Hyprland with: a plugin from another g++ can crash Hyprland
    # as it loads (std::format's internals differ). hyprpm's build hash leaves the compiler out, so after an Ubuntu
    # upgrade it would keep the old build: update forces a rebuild when the plugin's g++ isn't today's.
    script: |
      set -e
      sudo apt-get install -y -qq g++-14 glslang-dev liblua5.4-dev libhyprutils-dev libaquamarine-dev libhyprlang-dev libhyprcursor-dev libhyprgraphics-dev libxcb-errors-dev
      CXX=g++; [ "$(g++ -dumpversion | cut -d. -f1)" -ge 14 ] || CXX=g++-14
      export CXX CPATH=/usr/include/lua5.4${CPATH:+:$CPATH}
      hyprpm update
      if hyprpm list 2>/dev/null | grep -q hyprland-plugins; then hyprpm update -f; else hyprpm add https://github.com/hyprwm/hyprland-plugins; fi
      hyprpm enable hyprbars
      [ -z "${HYPRLAND_INSTANCE_SIGNATURE:-}" ] || hyprpm reload   # outside Hyprland: dotfiles.lua loads it at login
      hyprpm list | sed 's/\x1b\[[0-9;]*m//g' | grep -A1 'Plugin hyprbars$' | grep -q 'enabled: true' ||
        { echo "hyprbars didn't build: 'hyprpm -v update -f' shows why"; exit 1; }
    update: |   # rebuilds it after a Hyprland update, or with -f after a compiler change
      command -v hyprpm >/dev/null || exit 0
      # its build packages too: an Ubuntu upgrade (or a Hyprland reinstall) can remove them
      missing=$(for p in g++-14 glslang-dev liblua5.4-dev libhyprutils-dev libaquamarine-dev libhyprlang-dev libhyprcursor-dev libhyprgraphics-dev libxcb-errors-dev; do
        dpkg-query -W -f='${db:Status-Abbrev}' "$p" 2>/dev/null | grep -q '^ii' || echo "$p"; done)
      [ -z "$missing" ] || { echo "hyprbars: installing" $missing; sudo apt-get install -y -qq $missing; }
      CXX=g++; [ "$(g++ -dumpversion | cut -d. -f1)" -ge 14 ] || CXX=g++-14
      so=/var/cache/hyprpm/$(id -un)/hyprland-plugins/hyprbars.so force=
      # .comment holds e.g. "GCC: (Ubuntu 14.2.0-4ubuntu2~24.04.1) 14.2.0"; --version the same from "("
      if [ ! -f "$so" ]; then
        echo "hyprbars isn't built (a failed build leaves none): rebuilding"; force=-f
      elif ! readelf -p .comment "$so" 2>/dev/null | grep -qF "$("$CXX" --version | head -1 | sed 's/^[^(]*//')"; then
        echo "hyprbars was built with another g++: rebuilding"; force=-f
      fi
      CXX=$CXX CPATH=/usr/include/lua5.4 hyprpm update $force
    uninstall: >-
      hyprpm disable hyprbars; hyprpm remove https://github.com/hyprwm/hyprland-plugins; hyprpm reload;
      sudo apt-get remove -y -qq g++-14 glslang-dev liblua5.4-dev libhyprutils-dev libaquamarine-dev libhyprlang-dev libhyprcursor-dev libhyprgraphics-dev libxcb-errors-dev
  # Japanese input under Hyprland: fcitx5 + Mozc, Ctrl-Space (started in linux/hypr/dotfiles.lua). GNOME keeps ibus
  # (ibus-mozc below): with ibus installed, im-config's automatic choice stays ibus. Only where Hyprland is.
  - {name: fcitx5, when: desktop, skip_if: &no-hyprland '! command -v Hyprland >/dev/null'}
  - {name: fcitx5-mozc, when: desktop, skip_if: *no-hyprland}
  # GTK 3/4 and Qt 5/6 modules, for XWayland and older apps. The metapackage itself: removing one of its parts
  # by name would make apt mark the other parts manual, and autoremove would leave them
  - {name: fcitx5-frontend-all, when: desktop, skip_if: *no-hyprland}
  - {name: fcitx5-config-qt, when: desktop, skip_if: *no-hyprland}       # fcitx5-configtool: input methods, keys
  # Japanese input under Ubuntu's GNOME: ibus + Mozc, Ctrl-Space too (input sources and key set by linux/install.sh)
  - {name: ibus-mozc, when: desktop, skip_if: '! command -v gnome-shell >/dev/null'}
  - name: hyprshell   # Hyprland Alt-Tab switcher + launcher; config in linux/hyprshell, started by linux/hypr/dotfiles.lua
    when: desktop
    # Needs GTK 4.18+, libadwaita 1.8+ and gtk4-layer-shell 1.1.1+ (Ubuntu 26.04 on), and Hyprland 0.57+ (it binds its
    # keys through the Lua config; Ubuntu 26.04's own Hyprland is 0.53, the PPA's is newer): skipped before, and the
    # rofi Alt-Tab/launcher stay. Built with cargo (Rust 1.92+; 26.04's cargo is 1.93) into ~/.local/bin.
    skip_if: >-
      [ -x ~/.local/bin/hyprshell ] || ! command -v Hyprland >/dev/null ||
      ! dpkg --compare-versions "$(Hyprland --version | awk 'NR == 1 {print $2}')" ge 0.57 ||
      dpkg --compare-versions "$(apt-cache policy libgtk-4-1 | awk '/Candidate:/ {print $2}')" lt 4.18   # the GTK apt offers
    script: |
      set -e
      sudo apt-get install -y -qq cargo pkg-config libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev
      cargo install --locked --root ~/.local hyprshell
    update: "[ ! -x ~/.local/bin/hyprshell ] || cargo install --locked --root ~/.local hyprshell"   # a no-op when current
    uninstall: >-
      { cargo uninstall --root ~/.local hyprshell || rm -f ~/.local/bin/hyprshell; } &&
      sudo apt-get remove -y -qq cargo libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev

  # dev
  - gh
  - git-delta
  - shellcheck
  - jq
  - yq
  - cloc
  - name: lazygit
    github: jesseduffield/lazygit
    asset: lazygit_{version}_linux_{xarch}.tar.gz
  - name: code
    when: desktop
    repo:
      name: vscode
      key: https://packages.microsoft.com/keys/microsoft.asc
      url: https://packages.microsoft.com/repos/code
      suite: stable

  # infra
  - ansible
  - kubectx
  - name: kubectl
    script: |
      curl -fsSLo ~/.local/bin/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/$(dpkg --print-architecture)/kubectl"
      chmod +x ~/.local/bin/kubectl
    uninstall: rm -f ~/.local/bin/kubectl
  - name: helm
    script: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | HELM_INSTALL_DIR=~/.local/bin USE_SUDO=false bash >/dev/null
    uninstall: rm -f ~/.local/bin/helm
  - name: k9s
    github: derailed/k9s
    asset: k9s_Linux_{arch}.tar.gz
  - name: stern
    github: stern/stern
    asset: stern_{version}_linux_{arch}.tar.gz
  - name: terraform
    repo:
      name: hashicorp
      key: https://apt.releases.hashicorp.com/gpg
      url: https://apt.releases.hashicorp.com
  - name: aws
    script: |
      tmp=$(mktemp -d)
      curl -fsSLo "$tmp/aws.zip" "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip"
      unzip -q "$tmp/aws.zip" -d "$tmp"
      "$tmp/aws/install" -i ~/.local/share/aws-cli -b ~/.local/bin >/dev/null
      command rm -rf "$tmp"
    uninstall: rm -rf ~/.local/share/aws-cli ~/.local/bin/aws ~/.local/bin/aws_completer
  # Ubuntu's Docker; skipped when Docker CE/Desktop already provides docker (the packages conflict)
  - name: docker.io
    skip_if: &other-docker command -v docker >/dev/null && ! dpkg -s docker.io >/dev/null 2>&1
    post: id -nG | grep -qw docker || sudo usermod -aG docker "$USER"   # no sudo for docker (next login)
  - name: docker-compose-v2
    skip_if: *other-docker
  - name: docker-buildx
    skip_if: *other-docker

  # network
  - httpie
  - name: xh
    github: ducaale/xh
    asset: xh-{tag}-{m}-unknown-linux-musl.tar.gz
    file: xh-{tag}-{m}-unknown-linux-musl/xh
    post: '[ -e ~/.local/bin/ht ] || ln -s xh ~/.local/bin/ht'
    uninstall: rm -f ~/.local/bin/xh ~/.local/bin/ht
  - libcap2-bin  # setcap for bandwhich
  - gping        # ping, graphed
  - name: doggo  # dig
    github: mr-karan/doggo
    asset: doggo-linux-{m}.tar.gz
  - name: bandwhich # iftop, per process
    github: imsnif/bandwhich
    asset: bandwhich-{tag}-{m}-unknown-linux-musl.tar.gz
    post: getcap ~/.local/bin/bandwhich | grep -q cap_net_admin || sudo setcap cap_sys_ptrace,cap_dac_read_search,cap_net_raw,cap_net_admin+ep ~/.local/bin/bandwhich
  - nmap
  - tcpdump
  - tshark
  - termshark
  - mtr-tiny
  - iperf3
  - bind9-dnsutils
  - ipcalc
  - tcptraceroute
  - whois
  - bgpq4
  - socat

  # python: pyenv build deps, then pyenv with 3.11, 3.12 (global unless you picked one) and 3.14
  - python3
  - python3-yaml
  - virtualenvwrapper
  - build-essential
  - libssl-dev
  - zlib1g-dev
  - libbz2-dev
  - libreadline-dev
  - libsqlite3-dev
  - libncurses-dev
  - xz-utils
  - tk-dev
  - libxml2-dev
  - libxmlsec1-dev
  - libffi-dev
  - liblzma-dev
  - name: uv
    script: curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh >/dev/null
    uninstall: rm -f ~/.local/bin/uv ~/.local/bin/uvx
  - name: pyenv
    skip_if: test -d ~/.pyenv
    script: git clone -q https://github.com/pyenv/pyenv.git ~/.pyenv
    update: git -C ~/.pyenv pull -q --ff-only
    post: |
      export PYENV_ROOT=~/.pyenv; pyenv=~/.pyenv/bin/pyenv
      for v in 3.11 3.12 3.14; do
        v=$("$pyenv" latest -k "$v")
        [ -d ~/.pyenv/versions/"$v" ] || { echo "python $v (builds from source, a few minutes)"; "$pyenv" install -s "$v"; }
      done
      [ "$("$pyenv" global)" != system ] || "$pyenv" global "$("$pyenv" latest 3.12)"
    uninstall: rm -rf ~/.pyenv   # also deletes every pyenv Python and virtualenv
    tools:
      - ptpython   # nicer Python REPLs (aliases ptpy, bpy in linux/zsh/zsh_aliases)
      - bpython

  # ruby: rbenv + ruby-build with 3.2 (EOL 2026-03), 3.4 (global unless you picked one) and 4.0
  - autoconf
  - patch
  - libyaml-dev
  - libgmp-dev
  - libgdbm-dev
  - uuid-dev
  - name: rbenv
    skip_if: test -d ~/.rbenv
    script: |
      git clone -q https://github.com/rbenv/rbenv.git ~/.rbenv
      git clone -q https://github.com/rbenv/ruby-build.git ~/.rbenv/plugins/ruby-build
    update: git -C ~/.rbenv pull -q --ff-only && git -C ~/.rbenv/plugins/ruby-build pull -q --ff-only
    post: |
      export RBENV_ROOT=~/.rbenv; rbenv=~/.rbenv/bin/rbenv
      for s in 3.2 3.4 4.0; do
        v=$("$rbenv" install -L 2>/dev/null | tr -d ' ' | grep -E "^$s\.[0-9]+$" | sort -V | tail -1)
        [ -n "$v" ] || { echo "no Ruby $s release found"; continue; }
        [ -d ~/.rbenv/versions/"$v" ] || { echo "ruby $v (builds from source, a few minutes)"; "$rbenv" install -s "$v"; }
      done
      [ "$("$rbenv" global)" != system ] || "$rbenv" global "$(ls ~/.rbenv/versions | grep '^3\.4\.' | sort -V | tail -1)"
    uninstall: rm -rf ~/.rbenv   # also deletes every rbenv Ruby and its gems


  # go: official release in /usr/local/go (GOROOT), upgraded to the latest on each run.
  # Older/newer toolchains per project come from go.mod's `toolchain` line (Go downloads them itself).
  - name: go
    skip_if: test -x /usr/local/go/bin/go
    script: &go-latest |
      v=$(curl -fsSL 'https://go.dev/VERSION?m=text' | head -1)
      [ "$(/usr/local/go/bin/go env GOVERSION 2>/dev/null)" = "$v" ] && exit 0
      echo "go $v"
      tmp=$(mktemp)
      curl -fsSLo "$tmp" "https://go.dev/dl/$v.linux-$(dpkg --print-architecture).tar.gz"
      sudo rm -rf /usr/local/go && sudo tar -C /usr/local -xzf "$tmp"
      rm -f "$tmp"
    update: *go-latest
    uninstall: sudo rm -rf /usr/local/go
    tools:
      - golang.org/x/tools/gopls   # Go language server for vim-go and VS Code's Go extension

  # node
  - name: nvm
    skip_if: test -d ~/.nvm
    script: |
      git clone -q https://github.com/nvm-sh/nvm.git ~/.nvm
      git -C ~/.nvm -c advice.detachedHead=false checkout -q "$(git -C ~/.nvm describe --abbrev=0 --tags --match 'v[0-9]*' "$(git -C ~/.nvm rev-list --tags --max-count=1)")"
    uninstall: rm -rf ~/.nvm

  # AI CLIs (desktop apps are in the windows list)
  - name: claude
    script: curl -fsSL https://claude.ai/install.sh | bash >/dev/null
    uninstall: rm -rf ~/.local/bin/claude ~/.local/share/claude
  - name: codex
    github: openai/codex
    asset: codex-{m}-unknown-linux-musl.tar.gz
    file: codex-{m}-unknown-linux-musl
  - name: opencode
    script: curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path >/dev/null
    uninstall: rm -rf ~/.opencode

windows:
  # Wireshark/Nmap: the free Npcap installer can't run silently, so its setup window may appear
  - Git.Git
  - Microsoft.WindowsTerminal
  - Microsoft.VisualStudioCode
  - id: DEVCOM.JetBrainsMonoNerdFont
    font: JetBrainsMonoNerdFont
  - AmN.yasb
  - Microsoft.PowerToys
  - 9P7KNL5RWT25   # Sysinternals Suite from the Microsoft Store: the winget one fails its hash check whenever Microsoft
                   # updates the unversioned zip before the manifest, and the Store copy updates itself
  - voidtools.Everything
  - WiresharkFoundation.Wireshark
  - Insecure.Nmap
  - Anthropic.Claude
  - Anomaly.OpenCode.Desktop
