# Packages for every machine. Edit this file, then re-run the installer:
#   linux:   ~/dotfiles/install.sh --packages   (Debian/Ubuntu; also installs the windows list under WSL)
#   windows: install.ps1
#
# A plain string is a package name: apt package (linux) or winget id (windows).
# A map adds options. Linux keys (all optional except name):
#   repo:    extra apt source, refreshed every run (keys rotate):
#            {name, key: <gpg key url>, url: <deb url>, suite: <default: distro codename>, components: <default: main>}
#   github:  owner/repo; installs a binary from the latest release into ~/.local/bin
#            asset: release file name; file: path of the binary inside the .tar.gz (default: name)
#   script:  shell that installs it
#   skip_if: shell test; when it succeeds the install is skipped
#            (default for github/script: the command <name> exists)
#   update:  shell run on every run when already installed
#   post:    shell run on every run after installing
#   when:    desktop | wsl; install only on such machines
#   tools:   (go, pyenv, rbenv entries only) tools installed with that language's own installer, after it.
#            Each is a name, or {name, version}. Removing a line uninstalls that tool.
#              go:    go install <module path>@<version, default latest>   -> ~/go/bin
#              pyenv: uv tool install <name><version, e.g. '>=24'>         -> ~/.local/bin, isolated env per tool
#              rbenv: gem install <name> -v <version, e.g. '~> 8.0'>      -> rbenv's global Ruby
#   uninstall: shell that removes it (default: apt remove for apt, delete ~/.local/bin/<name> for github;
#            script installs without one are only warned about)
# Placeholders in asset/file: {tag} v1.2.3, {version} 1.2.3, {arch} amd64/arm64,
#   {m} x86_64/aarch64, {xarch} x86_64/arm64
# Windows keys: id; font: font file prefix (a hand-installed font isn't listed by winget).
#
# Removing: delete the entry and re-run. The installer uninstalls it (after asking) if it installed it on this
# machine. `install.sh --packages --adopt` once treats everything already installed from this list as its own.

settings:
  autoremove: true   # after uninstalling apt packages, also `apt-get autoremove` their leftover dependencies

linux:
  # base
  - git
  - curl
  - ca-certificates
  - gnupg
  - gpg
  - openssl
  - unzip
  - xclip

  # shell and editor
  - zsh
  - byobu
  - tmux
  - vim
  - fzf
  - ripgrep
  - fd-find
  - zoxide
  - eza
  - bat
  - direnv
  - btop
  - ncdu
  - name: tealdeer
    post: '[ -d ~/.cache/tealdeer ] || tldr --update >/dev/null 2>&1 || true'
  - name: starship
    script: curl -fsSL https://starship.rs/install.sh | sh -s -- -y -b ~/.local/bin >/dev/null
    uninstall: rm -f ~/.local/bin/starship

  # dev
  - gh
  - git-delta
  - shellcheck
  - jq
  - yq
  - cloc
  - name: lazygit
    github: jesseduffield/lazygit
    asset: lazygit_{version}_linux_{xarch}.tar.gz
  - name: code
    when: desktop
    repo:
      name: vscode
      key: https://packages.microsoft.com/keys/microsoft.asc
      url: https://packages.microsoft.com/repos/code
      suite: stable

  # infra
  - ansible
  - kubectx
  - name: kubectl
    script: |
      curl -fsSLo ~/.local/bin/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/$(dpkg --print-architecture)/kubectl"
      chmod +x ~/.local/bin/kubectl
    uninstall: rm -f ~/.local/bin/kubectl
  - name: helm
    script: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | HELM_INSTALL_DIR=~/.local/bin USE_SUDO=false bash >/dev/null
    uninstall: rm -f ~/.local/bin/helm
  - name: k9s
    github: derailed/k9s
    asset: k9s_Linux_{arch}.tar.gz
  - name: stern
    github: stern/stern
    asset: stern_{version}_linux_{arch}.tar.gz
  - name: terraform
    repo:
      name: hashicorp
      key: https://apt.releases.hashicorp.com/gpg
      url: https://apt.releases.hashicorp.com
  - name: aws
    script: |
      tmp=$(mktemp -d)
      curl -fsSLo "$tmp/aws.zip" "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip"
      unzip -q "$tmp/aws.zip" -d "$tmp"
      "$tmp/aws/install" -i ~/.local/share/aws-cli -b ~/.local/bin >/dev/null
      command rm -rf "$tmp"
    uninstall: rm -rf ~/.local/share/aws-cli ~/.local/bin/aws ~/.local/bin/aws_completer
  # Ubuntu's Docker; skipped when Docker CE/Desktop already provides docker (the packages conflict)
  - name: docker.io
    skip_if: &other-docker command -v docker >/dev/null && ! dpkg -s docker.io >/dev/null 2>&1
    post: id -nG | grep -qw docker || sudo usermod -aG docker "$USER"   # no sudo for docker (next login)
  - name: docker-compose-v2
    skip_if: *other-docker
  - name: docker-buildx
    skip_if: *other-docker

  # network
  - httpie
  - name: xh
    github: ducaale/xh
    asset: xh-{tag}-{m}-unknown-linux-musl.tar.gz
    file: xh-{tag}-{m}-unknown-linux-musl/xh
    post: '[ -e ~/.local/bin/ht ] || ln -s xh ~/.local/bin/ht'
    uninstall: rm -f ~/.local/bin/xh ~/.local/bin/ht
  - nmap
  - tcpdump
  - tshark
  - termshark
  - mtr-tiny
  - iperf3
  - bind9-dnsutils
  - ipcalc
  - tcptraceroute
  - whois
  - bgpq4
  - socat

  # python: pyenv build deps, then pyenv with 3.11, 3.12 (global unless you picked one) and 3.14
  - python3
  - python3-yaml
  - virtualenvwrapper
  - build-essential
  - libssl-dev
  - zlib1g-dev
  - libbz2-dev
  - libreadline-dev
  - libsqlite3-dev
  - libncurses-dev
  - xz-utils
  - tk-dev
  - libxml2-dev
  - libxmlsec1-dev
  - libffi-dev
  - liblzma-dev
  - name: uv
    script: curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh >/dev/null
    uninstall: rm -f ~/.local/bin/uv ~/.local/bin/uvx
  - name: pyenv
    skip_if: test -d ~/.pyenv
    script: git clone -q https://github.com/pyenv/pyenv.git ~/.pyenv
    update: git -C ~/.pyenv pull -q --ff-only
    post: |
      export PYENV_ROOT=~/.pyenv; pyenv=~/.pyenv/bin/pyenv
      for v in 3.11 3.12 3.14; do
        v=$("$pyenv" latest -k "$v")
        [ -d ~/.pyenv/versions/"$v" ] || { echo "python $v (builds from source, a few minutes)"; "$pyenv" install -s "$v"; }
      done
      [ "$("$pyenv" global)" != system ] || "$pyenv" global "$("$pyenv" latest 3.12)"
    uninstall: rm -rf ~/.pyenv   # also deletes every pyenv Python and virtualenv

  # ruby: rbenv + ruby-build with 3.2 (EOL 2026-03), 3.4 (global unless you picked one) and 4.0
  - autoconf
  - patch
  - libyaml-dev
  - libgmp-dev
  - libgdbm-dev
  - uuid-dev
  - name: rbenv
    skip_if: test -d ~/.rbenv
    script: |
      git clone -q https://github.com/rbenv/rbenv.git ~/.rbenv
      git clone -q https://github.com/rbenv/ruby-build.git ~/.rbenv/plugins/ruby-build
    update: git -C ~/.rbenv pull -q --ff-only && git -C ~/.rbenv/plugins/ruby-build pull -q --ff-only
    post: |
      export RBENV_ROOT=~/.rbenv; rbenv=~/.rbenv/bin/rbenv
      for s in 3.2 3.4 4.0; do
        v=$("$rbenv" install -L 2>/dev/null | tr -d ' ' | grep -E "^$s\.[0-9]+$" | sort -V | tail -1)
        [ -n "$v" ] || { echo "no Ruby $s release found"; continue; }
        [ -d ~/.rbenv/versions/"$v" ] || { echo "ruby $v (builds from source, a few minutes)"; "$rbenv" install -s "$v"; }
      done
      [ "$("$rbenv" global)" != system ] || "$rbenv" global "$(ls ~/.rbenv/versions | grep '^3\.4\.' | sort -V | tail -1)"
    uninstall: rm -rf ~/.rbenv   # also deletes every rbenv Ruby and its gems


  # go: official release in /usr/local/go (GOROOT), upgraded to the latest on each run.
  # Older/newer toolchains per project come from go.mod's `toolchain` line (Go downloads them itself).
  - name: go
    skip_if: test -x /usr/local/go/bin/go
    script: &go-latest |
      v=$(curl -fsSL 'https://go.dev/VERSION?m=text' | head -1)
      [ "$(/usr/local/go/bin/go env GOVERSION 2>/dev/null)" = "$v" ] && exit 0
      echo "go $v"
      tmp=$(mktemp)
      curl -fsSLo "$tmp" "https://go.dev/dl/$v.linux-$(dpkg --print-architecture).tar.gz"
      sudo rm -rf /usr/local/go && sudo tar -C /usr/local -xzf "$tmp"
      rm -f "$tmp"
    update: *go-latest
    uninstall: sudo rm -rf /usr/local/go
    tools:
      - golang.org/x/tools/gopls   # Go language server for vim-go and VS Code's Go extension

  # node
  - name: nvm
    skip_if: test -d ~/.nvm
    script: |
      git clone -q https://github.com/nvm-sh/nvm.git ~/.nvm
      git -C ~/.nvm -c advice.detachedHead=false checkout -q "$(git -C ~/.nvm describe --abbrev=0 --tags --match 'v[0-9]*' "$(git -C ~/.nvm rev-list --tags --max-count=1)")"
    uninstall: rm -rf ~/.nvm

  # AI CLIs (desktop apps are in the windows list)
  - name: claude
    script: curl -fsSL https://claude.ai/install.sh | bash >/dev/null
    uninstall: rm -rf ~/.local/bin/claude ~/.local/share/claude
  - name: codex
    github: openai/codex
    asset: codex-{m}-unknown-linux-musl.tar.gz
    file: codex-{m}-unknown-linux-musl
  - name: opencode
    script: curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path >/dev/null
    uninstall: rm -rf ~/.opencode

windows:
  # Wireshark/Nmap: the free Npcap installer can't run silently, so its setup window may appear
  - Git.Git
  - Microsoft.WindowsTerminal
  - Microsoft.VisualStudioCode
  - id: DEVCOM.JetBrainsMonoNerdFont
    font: JetBrainsMonoNerdFont
  - AmN.yasb
  - Microsoft.PowerToys
  - Microsoft.Sysinternals.Suite
  - voidtools.Everything
  - WiresharkFoundation.Wireshark
  - Insecure.Nmap
  - Anthropic.Claude
  - Anomaly.OpenCode.Desktop
