  # ================================================================================================================
  # notes: Joplin. Markdown notes and to-dos, synced through Joplin Cloud, OneDrive, Dropbox, Nextcloud/WebDAV or S3
  # (end-to-end encryption optional). Set the same sync target in each app: `joplin config sync.target` in the CLI.
  # The terminal app (`joplin`) is an npm package: it gets its own Node LTS in ~/.local/share/joplin-cli (Ubuntu
  # 24.04's Node 18 is too old for it, and nvm's versions come and go); Node needs libatomic1
  - libatomic1

  - name: joplin               # the terminal app (`joplin`)
    skip_if: test -x ~/.local/share/joplin-cli/bin/joplin
    script: &joplin-cli |   # also its update: Node and Joplin are only fetched when newer
      set -e
      d=~/.local/share/joplin-cli
      v=$(curl -fsSL https://nodejs.org/dist/index.json | python3 -c 'import json, sys; print(next(r["version"] for r in json.load(sys.stdin) if r["lts"]))')
      a=$(dpkg --print-architecture | sed 's/amd64/x64/')
      if [ "$("$d/node/bin/node" --version 2>/dev/null)" != "$v" ]; then
        tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
        curl -fsSL "https://nodejs.org/dist/$v/node-$v-linux-$a.tar.xz" | tar -xJ -C "$tmp"
        rm -rf "$d/node" && mkdir -p "$d" && mv "$tmp/node-$v-linux-$a" "$d/node"
      fi
      export PATH=$d/node/bin:$PATH
      have=$(node -p 'require(process.argv[1]).version' "$d/lib/node_modules/joplin/package.json" 2>/dev/null || true)
      [ "$have" = "$(npm view joplin version)" ] || npm install -g -s --prefix "$d" joplin@latest >/dev/null
      printf '#!/bin/sh\nPATH=%s/node/bin:$PATH exec %s/bin/joplin "$@"\n' "$d" "$d" >| ~/.local/bin/joplin
      chmod +x ~/.local/bin/joplin
    update: *joplin-cli
    uninstall: rm -rf ~/.local/share/joplin-cli ~/.local/bin/joplin   # notes stay in ~/.config/joplin

