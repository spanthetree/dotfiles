  # chat: Beeper, one app for WhatsApp, Signal, Telegram, Matrix and the rest (Linux desktop here, Windows below; not
  # WSL). It keeps your chats decrypted in a local database, so `private:` checks the machine first: on one with
  # software that can read its files or record its screen (e.g. a work machine's EDR), it asks before installing.
  # The AppImage is unpacked into ~/.local/opt/beeper and updated by the installer (Beeper can't update itself
  # unpacked), so Chromium's sandbox stays on: Beeper's own menu entry turns it off (--no-sandbox), as Ubuntu 24.04+
  # blocks the user namespaces it needs; an AppArmor profile allows them for this one program instead
  - name: beeper
    when: desktop
    private: Beeper keeps your chats decrypted in a local database and shows them on screen
    skip_if: test -x ~/.local/opt/beeper/app/beepertexts
    script: &beeper |
      d=~/.local/opt/beeper
      url=https://api.beeper.com/desktop/download/linux/x64/stable/com.automattic.beeper.desktop
      [ "$(uname -m)" = x86_64 ] || { echo "Beeper: no Linux build for $(uname -m)"; exit 1; }
      loc=$(curl -fsSI "$url" | tr -d '\r' | awk 'tolower($1) == "location:" {print $2}' | tail -1)
      v=${loc##*/Beeper-}; v=${v%-x86_64.AppImage}
      [ -n "$loc" ] && [ "$v" != "$loc" ] || { echo "Beeper: no download found"; exit 1; }
      [ -x "$d/app/beepertexts" ] && [ "$(cat "$d/version" 2>/dev/null)" = "$v" ] && exit 0
      if pgrep -x beepertexts >/dev/null; then echo "Beeper $v is out: quit Beeper, then re-run to update"; exit 0; fi
      echo "beeper $v"
      tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
      curl -fsSL -o "$tmp/Beeper.AppImage" "$loc" && chmod +x "$tmp/Beeper.AppImage"
      (cd "$tmp" && ./Beeper.AppImage --appimage-extract >/dev/null)
      mkdir -p "$d" && rm -rf "$d/app" && mv "$tmp/squashfs-root" "$d/app" && echo "$v" >"$d/version"
      install -Dm644 "$d/app/beepertexts.png" ~/.local/share/icons/hicolor/512x512/apps/beepertexts.png
      mkdir -p ~/.local/share/applications
      sed "s|^Exec=.*|Exec=$d/app/beepertexts %U|" "$d/app/beepertexts.desktop" >~/.local/share/applications/beepertexts.desktop
      ! command -v update-desktop-database >/dev/null || update-desktop-database -q ~/.local/share/applications
      # (Ubuntu 24.04+: AppArmor running, with the abi that has userns)
      if [ -e /etc/apparmor.d/abi/4.0 ] && [ -d /sys/kernel/security/apparmor ] && command -v apparmor_parser >/dev/null; then
        printf 'abi <abi/4.0>,\ninclude <tunables/global>\n\nprofile dotfiles-beeper %s flags=(unconfined) {\n  userns,\n  include if exists <local/dotfiles-beeper>\n}\n' \
          "$d/app/beepertexts" | sudo tee /etc/apparmor.d/dotfiles-beeper >/dev/null
        sudo apparmor_parser -r /etc/apparmor.d/dotfiles-beeper
      fi
    update: *beeper
    uninstall: |   # Beeper's data (your chats) stays in ~/.config/BeeperTexts: delete it to remove them too
      if [ -e /etc/apparmor.d/dotfiles-beeper ]; then
        sudo apparmor_parser -R /etc/apparmor.d/dotfiles-beeper 2>/dev/null; sudo rm -f /etc/apparmor.d/dotfiles-beeper
      fi
      rm -rf ~/.local/opt/beeper ~/.local/share/applications/beepertexts.desktop ~/.local/share/icons/hicolor/512x512/apps/beepertexts.png

