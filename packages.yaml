  # infra
  - ansible
  - kubectx
  - name: kubectl
    script: |
      curl -fsSLo ~/.local/bin/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/$(dpkg --print-architecture)/kubectl"
      chmod +x ~/.local/bin/kubectl
    uninstall: rm -f ~/.local/bin/kubectl
  # krew: kubectl plugins, in ~/.krew (its bin is on PATH in zshenv). Each tool is `kubectl <name>`
  - name: krew
    skip_if: test -x ~/.krew/bin/kubectl-krew
    script: |
      set -e
      tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
      a=$(dpkg --print-architecture)
      curl -fsSL "https://github.com/kubernetes-sigs/krew/releases/latest/download/krew-linux_$a.tar.gz" | tar -xz -C "$tmp"
      "$tmp/krew-linux_$a" install krew >/dev/null
    update: ~/.krew/bin/kubectl-krew update >/dev/null && ~/.krew/bin/kubectl-krew upgrade >/dev/null   # index, then krew and its plugins
    uninstall: rm -rf ~/.krew
    tools:
      - neat          # kubectl neat: manifests without status and managed fields
      - tree          # kubectl tree: what owns what
      - view-secret   # kubectl view-secret: decoded secrets
      - node-shell    # kubectl node-shell: root shell on a node
      - df-pv         # kubectl df-pv: PV usage
      - who-can       # kubectl who-can: RBAC, who may do a verb on a resource
  - name: kubeshark   # API traffic viewer for a cluster (deploys its agents into it)
    github: kubeshark/kubeshark
    asset: kubeshark_linux_{arch}
  - name: helm
    skip_if: test -x ~/.local/bin/helm   # ours, even where an older helm exists (it can't load helm-diff's current plugin.yaml)
    script: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | HELM_INSTALL_DIR=~/.local/bin USE_SUDO=false bash >/dev/null
    uninstall: rm -f ~/.local/bin/helm
  - name: helm-diff   # helm diff upgrade: what an upgrade would change (helmfile uses it too)
    skip_if: ~/.local/bin/helm plugin list 2>/dev/null | grep -q '^diff'
    script: mkdir -p "$(~/.local/bin/helm env HELM_PLUGINS)" && ~/.local/bin/helm plugin install https://github.com/databus23/helm-diff >/dev/null
    update: ~/.local/bin/helm plugin update diff >/dev/null
    uninstall: ~/.local/bin/helm plugin uninstall diff >/dev/null
  - name: helmfile
    github: helmfile/helmfile
    asset: helmfile_{version}_linux_{arch}.tar.gz
  - name: k9s
    github: derailed/k9s
    asset: k9s_Linux_{arch}.tar.gz
  - name: stern
