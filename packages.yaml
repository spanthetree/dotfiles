# Packages for every machine. Edit this file, then re-run the installer:
#   linux:   ~/dotfiles/install.sh   (Debian/Ubuntu; also installs the windows list under WSL)
#   windows: install.ps1
#
# A plain string is a package name: apt package (linux) or winget id (windows).
# A map adds options. Linux keys (all optional except name):
#   repo:    extra apt source, refreshed every run (keys rotate):
#            {name, key: <gpg key url>, url: <deb url>, suite: <default: distro codename>, components: <default: main>}
#   github:  owner/repo; installs a binary from the latest release into ~/.local/bin, and updates it on later runs
#            asset: release file name (.tar.gz/.tar.xz/.zip, or the bare binary)
#            file: path of the binary inside the archive (default: name)
#            extra: more files from the same archive, each into ~/.local/bin under its own name (e.g. tenv's proxies);
#            updated and removed with it
#   script:  shell that installs it
#   skip_if: shell test; when it succeeds the install is skipped
#            (default for github/script: the command <name> exists)
#   update:  shell run on every run when already installed
#   post:    shell run on every run after installing
#   when:    desktop | wsl; install only on such machines
#            cosmic: only where the COSMIC desktop is chosen (install.cmd --cosmic; --no-cosmic drops it and offers to
#            uninstall these, apt repo included)
#            hyprland: the same for the Hyprland desktop setup (install.cmd --hyprland / --no-hyprland)
#            in-hyprland: the Hyprland layer (plugins, panel, switcher...): only on a run from inside a Hyprland
#            session, or where the Hyprland desktop is chosen. Elsewhere skipped, neither installed, updated nor removed
#   private: <what the app keeps, as a sentence>: for apps holding private data (e.g. chats). Before installing it,
#            linux/monitoring-check looks for software that can read this machine's files or record its screen
#            (endpoint security, DLP, screen monitoring). Nothing found: installed as usual. Found: it says what and asks
#            (default no; --yes and no terminal mean no). The answer is kept until the findings change
#            (~/.local/state/dotfiles/private.json). Script and github entries only
#   interactive: true runs script/update/post/uninstall in the terminal, without the spinner, so a prompt
#            the step can't avoid (e.g. a tool that runs sudo itself and asks again) is seen and answered
#   tools:   (go, uv, ruby, krew entries only) tools installed with that language's own installer, after it.
#            Each is a name, or {name, version}. Removing a line uninstalls that tool.
#              go:    go install <module path>@<version, default latest>   -> ~/go/bin
#              uv:    uv tool install <name><version, e.g. '>=24'>         -> ~/.local/bin, isolated env per tool
#              ruby:  gem install <name> -v <version, e.g. '~> 8.0'>      -> mise's global Ruby
#              krew:  kubectl krew install <name> (no version)            -> ~/.krew, as `kubectl <name>`
#   Shell steps run in bash, with $DOT set to this repo. For apt packages a step needs, use "$DOT/linux/apt-deps"
#   install|remove (and `own` after installing a release .deb), never apt-get install/remove: see that file
#   uninstall: shell that removes it (default: apt remove for apt, delete ~/.local/bin/<name> for github;
#            script installs without one are only warned about). An entry's apt `repo` goes with it.
# Placeholders in asset/file: {tag} v1.2.3, {version} 1.2.3, {arch} amd64/arm64,
#   {m} x86_64/aarch64, {xarch} x86_64/arm64, {x64} x64/arm64
# Windows keys: id; font: font file prefix (a hand-installed font isn't listed by winget); private: as above, checked
#   by windows/monitoring-check.ps1 (answers in %LOCALAPPDATA%\dotfiles\private.json, shared by install.ps1 and WSL).
#
# Layout: both lists are grouped by what each tool is for, under banner comments; every entry says what it's for.
# Order matters in the linux list: an entry comes after what it needs (mise before python, uv before suzieq, a
# desktop before its layer), and uninstalls run in reverse.
#
# Removing: delete the entry and re-run. The installer uninstalls it (after asking) if it installed it on this
# machine. `install.sh --adopt` once treats everything already installed from this list as its own.

settings:
  autoremove: true   # after uninstalling apt packages, also remove the dependencies that left unneeded (only those: never a system-wide autoremove)
  upgrade: true      # each run also `apt-get upgrade`s the whole system (GitHub binaries update to their latest release regardless)

linux:
  # ================================================================================================================
  # Base system
  # Needed by the installer and almost everything else.
  # ================================================================================================================
  - git                        # version control
  - curl                       # HTTP downloads (the installer uses it)
  - ca-certificates            # TLS root certificates
  - gnupg                      # OpenPGP: apt repo keys, ~/.zsh_secrets.gpg
  - gpg                        # the gpg command
  - openssl                    # TLS and certificates CLI
  - unzip                      # .zip archives
  - xclip                      # clipboard from the terminal (X11/XWayland)

  # ================================================================================================================
  # Shell and terminal
  # zsh, byobu (tmux), the prompt, completions, history and navigation.
  # ================================================================================================================
  - zsh                        # the shell (config: linux/zsh)
  - byobu                      # tmux with tabs and status rows: the terminal workspace (linux/byobu)
  - tmux                       # byobu's backend
  - vim                        # editor (linux/vim)

  - name: starship             # the prompt (linux/starship)
    script: curl -fsSL https://starship.rs/install.sh | sh -s -- -y -b ~/.local/bin >/dev/null
    uninstall: rm -f ~/.local/bin/starship

  - name: fzf                  # from its release, not apt (Ubuntu 24.04's is 0.44); shell keys from `fzf --zsh` in zshrc
    github: junegunn/fzf
    asset: fzf-{version}-linux_{arch}.tar.gz
    # ours even where apt's is. apt's /usr/bin/fzf comes first on PATH: the installer removes it where it installed
    # it (an older `- fzf` line); one installed some other way stays until `sudo apt remove fzf`
    skip_if: test -x ~/.local/bin/fzf

  - name: carapace             # completions for commands zsh has none for (zshrc: zsh's own, e.g. git's or ssh's, win)
    github: carapace-sh/carapace-bin
    asset: carapace-bin_{version}_linux_{arch}.tar.gz

  - name: navi                 # cheatsheet picker: Ctrl-G in zsh (zshrc). Cheats: denisidoro/cheats, plus your own .cheat files
    github: denisidoro/navi
    asset: navi-{tag}-{m}-unknown-linux-musl.tar.gz
    file: ./navi
    # a clone, not `navi repo add` (2.24 fails copying its own temp dir); pulled on each run
    post: >-
      d=~/.local/share/navi/cheats/denisidoro__cheats;
      if [ -d "$d/.git" ]; then git -C "$d" pull -q --ff-only; else git clone -q --depth 1 https://github.com/denisidoro/cheats "$d"; fi
    uninstall: rm -rf ~/.local/bin/navi ~/.local/share/navi/cheats/denisidoro__cheats

  - zoxide                     # cd that learns your folders (z)
  - direnv                     # per-folder env from .envrc

  # tealdeer (`tldr`): from its release, not apt: Ubuntu 24.04's 1.6 downloads its pages from a URL that's gone.
  # Config in linux/tealdeer (SynthWave colours; refreshes its pages weekly by itself). apt's /usr/bin/tldr comes first
  # on PATH: the installer removes it where it installed it (an older `- tealdeer` line)
  - name: tldr
    github: tealdeer-rs/tealdeer
    asset: tealdeer-linux-{m}-musl
    skip_if: test -x ~/.local/bin/tldr
    post: ~/.local/bin/tldr --quiet --update   # its pages: fetched on the first run, current on each one after
    uninstall: rm -rf ~/.local/bin/tldr ~/.cache/tealdeer

  # tmux hint-mode copy (linux/byobu/profile.tmux): F12 F labels URLs, paths, IPs, hashes on screen; type the label to
  # copy. Loads from its binary alone (tmux-fingers load-config), no plugin clone
  - name: tmux-fingers
    github: Morantron/tmux-fingers
    asset: tmux-fingers-{version}-linux-{m}

  - name: kitten               # kitty's helper: `icat` alias shows images in kitty (also inside byobu). Comes with kitty on a desktop
    github: kovidgoyal/kitty
    asset: kitten-linux-{arch}

  # ================================================================================================================
  # Files, search and system
  # Modern replacements for classic tools (the classic one is in the comment).
  # ================================================================================================================
  - ripgrep                    # grep, faster (rg)
  - fd-find                    # find, simpler (fd)
  - eza                        # ls with icons and git status
  - bat                        # cat with syntax highlighting
  - duf                        # df
  - gdu                        # ncdu, faster

  - name: dust                 # du
    github: bootandy/dust
    asset: dust-{tag}-{m}-unknown-linux-musl.tar.gz
    file: dust-{tag}-{m}-unknown-linux-musl/dust

  - name: procs                # ps
    github: dalance/procs
    asset: procs-{tag}-{m}-linux.zip

  - btop                       # top, with graphs

  - name: viddy                # watch
    github: sachaos/viddy
    asset: viddy-{tag}-linux-{m}.tar.gz

  - name: yazi                 # file manager
    github: sxyazi/yazi
    asset: yazi-{m}-unknown-linux-musl.zip
    file: yazi-{m}-unknown-linux-musl/yazi

  - name: broot                # tree/cd navigator
    github: Canop/broot
    asset: broot_{version}.zip
    file: '{m}-unknown-linux-musl/broot'

  - name: ouch                 # tar/zip/unzip
    github: ouch-org/ouch
    asset: ouch-{m}-unknown-linux-musl.tar.gz
    file: ouch-{m}-unknown-linux-musl/ouch

  - sd                         # sed find/replace

  - name: choose               # cut / awk '{print $2}'
    github: theryangeary/choose
    asset: choose-{m}-unknown-linux-musl

  - hexyl                      # xxd/hexdump

  # ================================================================================================================
  # Data and logs
  # Query, reshape and view JSON, YAML, CSV and logs.
  # ================================================================================================================
  - jq                         # JSON query
  - yq                         # YAML/JSON/XML query, jq syntax

  - name: jaq                  # jq, faster (same filters)
    github: 01mf02/jaq
    asset: jaq-{m}-unknown-linux-musl

  - name: fx                   # JSON viewer
    github: antonmedv/fx
    asset: fx_linux_{arch}

  - gron                       # JSON to greppable lines (gron -u back)
  - jc                         # command output (ifconfig, dig, netstat...) to JSON: `dig x | jc --dig`
  - lnav                       # log viewer: merges, filters, SQL over logs
  - visidata                   # vd: spreadsheet TUI for CSV/JSON/SQLite/...

  - name: rare                 # histograms, tables, sums from log lines (regex/dissect)
    github: zix99/rare
    asset: rare_{version}_Linux_{xarch}.tar.gz

  # ================================================================================================================
  # Languages and runtimes
  # Python and Ruby versions come from mise, prebuilt (no compiling). Each run adds the newest patch release of each
  # (older ones stay until `mise prune`), and sets the global one only while there is none: yours stays. Global in
  # ~/.config/mise/config.toml; per project from mise.toml, .tool-versions, .python-version or .ruby-version.
  # The build deps below are for versions with no prebuilt build, and for packages with native extensions.
  # Order matters: mise before the python, ruby and go entries; uv before the tools that install with it.
  # ================================================================================================================
  - name: mise                 # Python, Ruby and Go versions (their entries below), per project too; activated in zshrc
    script: curl -fsSL https://mise.run | MISE_INSTALL_PATH=~/.local/bin/mise sh >/dev/null
    update: ~/.local/bin/mise self-update -y >/dev/null
    # the tools and runtimes it installed too (your ~/.config/mise stays)
    uninstall: rm -rf ~/.local/bin/mise ~/.local/share/mise ~/.local/state/mise ~/.cache/mise

  # --- Python
  - python3                    # the system Python (the installer's)
  - python3-yaml               # PyYAML for it (packages.py reads this file)
  - virtualenvwrapper          # mkvirtualenv / workon
  - build-essential            # compilers, make
  - libssl-dev                 # OpenSSL headers
  - zlib1g-dev                 # zlib headers
  - libbz2-dev                 # bzip2 headers
  - libreadline-dev            # readline headers
  - libsqlite3-dev             # SQLite headers
  - libncurses-dev             # curses headers
  - xz-utils                   # xz
  - tk-dev                     # Tk headers (tkinter)
  - libxml2-dev                # libxml2 headers
  - libxmlsec1-dev             # xmlsec headers
  - libffi-dev                 # libffi headers (ctypes)
  - liblzma-dev                # lzma headers

  - name: python               # 3.11, 3.12 (global unless you picked one) and 3.14
    skip_if: test -n "$(~/.local/bin/mise ls --installed python 2>/dev/null)"
    script: &mise-python |
      m=~/.local/bin/mise
      for s in 3.11 3.12 3.14; do
        v=$("$m" latest python@$s) && [ -n "$v" ] || { echo "no Python $s release found"; continue; }
        "$m" where python@$v >/dev/null 2>&1 || { echo "python $v"; "$m" install -q python@$v; }
      done
      "$m" config get -f ~/.config/mise/config.toml tools.python >/dev/null 2>&1 || "$m" use -q -g python@3.12
    update: *mise-python
    # every mise Python, and the global one
    uninstall: m=~/.local/bin/mise; "$m" unuse -q -g --no-prune python; "$m" uninstall -q --all python

  - name: uv                   # Python packages, venvs and tools, fast (uv tool install)
    script: curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh >/dev/null
    uninstall: rm -f ~/.local/bin/uv ~/.local/bin/uvx
    tools:
      - ptpython   # nicer Python REPLs (aliases ptpy, bpy in linux/zsh/zsh_aliases)
      - bpython
      - httpstat   # curl with a timing breakdown: DNS, connect, TLS, server, transfer

  # --- Ruby
  # ruby build deps (for versions with no prebuilt build, and gems with native extensions)
  - autoconf

  - patch                      # patch
  - libyaml-dev                # libyaml headers
  - libgmp-dev                 # GMP headers (big numbers)
  - libgdbm-dev                # gdbm headers
  - uuid-dev                   # uuid headers

  - name: ruby                 # 3.2 (EOL 2026-03), 3.4 (global unless you picked one) and 4.0
    skip_if: test -n "$(~/.local/bin/mise ls --installed ruby 2>/dev/null)"
    script: &mise-ruby |
      m=~/.local/bin/mise
      for s in 3.2 3.4 4.0; do
        v=$("$m" latest ruby@$s) && [ -n "$v" ] || { echo "no Ruby $s release found"; continue; }
        "$m" where ruby@$v >/dev/null 2>&1 || { echo "ruby $v"; "$m" install -q ruby@$v; }
      done
      "$m" config get -f ~/.config/mise/config.toml tools.ruby >/dev/null 2>&1 || "$m" use -q -g ruby@3.4
    update: *mise-ruby
    # every mise Ruby with its gems, and the global one
    uninstall: m=~/.local/bin/mise; "$m" unuse -q -g --no-prune ruby; "$m" uninstall -q --all ruby

  # --- Go, Rust, Node
  # go: from mise, the latest release added on each run (global `latest` unless you picked one; older ones stay until
  # `mise prune`). Toolchains per project also come from go.mod's `toolchain` line (Go downloads them itself).
  # GOPATH stays ~/go: `go install` tools land in ~/go/bin
  - name: go
    skip_if: test -n "$(~/.local/bin/mise ls --installed go 2>/dev/null)"
    script: &mise-go |
      m=~/.local/bin/mise
      v=$("$m" latest go) && [ -n "$v" ] || { echo "no Go release found"; exit 1; }
      "$m" where go@$v >/dev/null 2>&1 || { echo "go $v"; "$m" install -q go@$v; }
      "$m" config get -f ~/.config/mise/config.toml tools.go >/dev/null 2>&1 || "$m" use -q -g go@latest
    update: *mise-go
    # every mise Go, and the global one (~/go and its tools stay)
    uninstall: m=~/.local/bin/mise; "$m" unuse -q -g --no-prune go; "$m" uninstall -q --all go
    tools:
      - golang.org/x/tools/gopls   # Go language server for vim-go and VS Code's Go extension

  # rust: rustup with the stable toolchain (rustc, cargo, clippy, rustfmt, rust-analyzer), updated each run.
  # In ~/.rustup and ~/.cargo (zshenv puts ~/.cargo/bin on PATH). Its uninstall deletes ~/.cargo, with anything
  # `cargo install` put there
  - name: rustup
    skip_if: test -x ~/.cargo/bin/rustup
    script: |
      curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y -q --no-modify-path --profile default >/dev/null 2>&1
      ~/.cargo/bin/rustup component add rust-analyzer >/dev/null 2>&1 || true
    update: ~/.cargo/bin/rustup update >/dev/null 2>&1
    uninstall: ~/.cargo/bin/rustup self uninstall -y

  - name: nvm                  # Node versions (nvm use)
    skip_if: test -d ~/.nvm
    script: |
      git clone -q https://github.com/nvm-sh/nvm.git ~/.nvm
      git -C ~/.nvm -c advice.detachedHead=false checkout -q "$(git -C ~/.nvm describe --abbrev=0 --tags --match 'v[0-9]*' "$(git -C ~/.nvm rev-list --tags --max-count=1)")"
    uninstall: rm -rf ~/.nvm

  # ================================================================================================================
  # Dev tools
  # git, building and testing, APIs and databases, secrets.
  # ================================================================================================================
  # --- git
  - gh                         # GitHub CLI
  - git-delta                  # git's diff pager, with syntax highlighting (delta)

  - name: lazygit              # git TUI
    github: jesseduffield/lazygit
    asset: lazygit_{version}_linux_{xarch}.tar.gz

  - name: difft                # difftastic: structural diff
    github: Wilfred/difftastic
    asset: difft-{version}-{m}-unknown-linux-musl.tar.gz

  - name: gitleaks             # finds secrets (tokens, keys) in git changes; this repo's pre-commit hook (.githooks) runs it
    github: gitleaks/gitleaks
    asset: gitleaks_{version}_linux_{x64}.tar.gz

  # --- build, test, measure
  - shellcheck                 # shell script linter
  - just                       # make, as a task runner

  - name: watchexec            # rerun on file change
    github: watchexec/watchexec
    asset: watchexec-{version}-{m}-unknown-linux-gnu.tar.xz
    file: watchexec-{version}-{m}-unknown-linux-gnu/watchexec

  - hyperfine                  # time, benchmarking

  - name: scc                  # cloc/tokei (tokei has no recent release binaries)
    github: boyter/scc
    asset: scc_Linux_{xarch}.tar.gz

  - name: d2                   # diagrams from text: `d2 -w in.d2 out.svg` (live preview)
    github: terrastruct/d2
    asset: d2-{tag}-linux-{arch}.tar.gz
    file: d2-{tag}/bin/d2

  # --- APIs and databases
  - name: grpcurl              # curl for gRPC
    github: fullstorydev/grpcurl
    asset: grpcurl_{version}_linux_{xarch}.tar.gz

  - name: websocat             # netcat for WebSockets
    github: vi/websocat
    asset: websocat.{m}-unknown-linux-musl

  - name: usql                 # one SQL CLI for Postgres, MySQL, SQLite, MSSQL, Oracle... (static build: every driver)
    github: xo/usql
    asset: usql_static-{version}-linux-{arch}.tar.bz2
    file: usql_static

  - kcat                       # Kafka producer/consumer/metadata

  # --- secrets and certificates
  - name: sops                 # encrypted secrets in YAML/JSON/env files; with age keys (~/.config/sops/age/keys.txt, per machine)
    github: getsops/sops
    asset: sops-{tag}.linux.{arch}

  - age                        # file encryption, sops' key type

  - name: step                 # smallstep CLI: certificates, CSRs, inspect TLS (`step certificate inspect https://host`), JWTs
    github: smallstep/cli
    asset: step_linux_{version}_{arch}.tar.gz
    file: step_{version}/bin/step

  # ================================================================================================================
  # Containers and Kubernetes
  # ================================================================================================================
  # Ubuntu's Docker; skipped when Docker CE/Desktop already provides docker (the packages conflict)
  - name: docker.io
    skip_if: &other-docker command -v docker >/dev/null && ! dpkg -s docker.io >/dev/null 2>&1
    post: id -nG | grep -qw docker || sudo usermod -aG docker "$USER"   # no sudo for docker (next login)

  - name: docker-compose-v2    # docker compose
    skip_if: *other-docker

  - name: docker-buildx        # docker buildx: multi-platform builds
    skip_if: *other-docker

  - name: kubectl              # Kubernetes CLI
    script: |
      curl -fsSLo ~/.local/bin/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/$(dpkg --print-architecture)/kubectl"
      chmod +x ~/.local/bin/kubectl
    uninstall: rm -f ~/.local/bin/kubectl

  # krew: kubectl plugins, in ~/.krew (its bin is on PATH in zshenv). Each tool is `kubectl <name>`
  - name: krew
    skip_if: test -x ~/.krew/bin/kubectl-krew
    script: |
      set -e
      tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
      a=$(dpkg --print-architecture)
      curl -fsSL "https://github.com/kubernetes-sigs/krew/releases/latest/download/krew-linux_$a.tar.gz" | tar -xz -C "$tmp"
      "$tmp/krew-linux_$a" install krew >/dev/null
    update: ~/.krew/bin/kubectl-krew update >/dev/null && ~/.krew/bin/kubectl-krew upgrade >/dev/null   # index, then krew and its plugins
    uninstall: rm -rf ~/.krew
    tools:
      - neat          # kubectl neat: manifests without status and managed fields
      - tree          # kubectl tree: what owns what
      - view-secret   # kubectl view-secret: decoded secrets
      - node-shell    # kubectl node-shell: root shell on a node
      - df-pv         # kubectl df-pv: PV usage
      - who-can       # kubectl who-can: RBAC, who may do a verb on a resource

  - kubectx                    # switch kube contexts and namespaces (kubectx, kubens)

  - name: k9s                  # Kubernetes TUI
    github: derailed/k9s
    asset: k9s_Linux_{arch}.tar.gz

  - name: stern                # logs from many pods at once
    github: stern/stern
    asset: stern_{version}_linux_{arch}.tar.gz

  - name: kubeshark            # API traffic viewer for a cluster (deploys its agents into it)
    github: kubeshark/kubeshark
    asset: kubeshark_linux_{arch}

  - name: helm                 # Kubernetes package manager
    skip_if: test -x ~/.local/bin/helm   # ours, even where an older helm exists (it can't load helm-diff's current plugin.yaml)
    script: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | HELM_INSTALL_DIR=~/.local/bin USE_SUDO=false bash >/dev/null
    uninstall: rm -f ~/.local/bin/helm

  - name: helm-diff            # helm diff upgrade: what an upgrade would change (helmfile uses it too)
    skip_if: ~/.local/bin/helm plugin list 2>/dev/null | grep -q '^diff'
    script: mkdir -p "$(~/.local/bin/helm env HELM_PLUGINS)" && ~/.local/bin/helm plugin install https://github.com/databus23/helm-diff >/dev/null
    update: ~/.local/bin/helm plugin update diff >/dev/null
    uninstall: ~/.local/bin/helm plugin uninstall diff >/dev/null

  - name: helmfile             # helm releases, declared in a file
    github: helmfile/helmfile
    asset: helmfile_{version}_linux_{arch}.tar.gz

  - name: kind                 # throwaway local clusters: upstream Kubernetes in Docker (kind create cluster); also a containerlab node kind
    github: kubernetes-sigs/kind
    asset: kind-linux-{arch}

  # containerlab: network labs (SR Linux, cEOS, FRR, Linux...) as containers, wired from a topology file. Its .deb
  # from the release (its apt repo is unsigned, trusted=yes). Router images are pulled per lab; some (cEOS) need a
  # vendor login. The package makes the clab_admins group: you're added, so it runs without sudo (next login)
  - name: containerlab
    skip_if: dpkg -s containerlab >/dev/null 2>&1
    script: &containerlab |   # also its update: a no-op when it's the latest release
      set -e
      tag=$(curl -fsSLo /dev/null -w '%{url_effective}' https://github.com/srl-labs/containerlab/releases/latest | sed 's|.*/||')
      [ "$(dpkg-query -W -f='${Version}' containerlab 2>/dev/null)" = "${tag#v}" ] && exit 0
      tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT; chmod 755 "$tmp"   # apt's _apt user reads the .deb
      curl -fsSLo "$tmp/clab.deb" "https://github.com/srl-labs/containerlab/releases/download/$tag/containerlab_${tag#v}_linux_$(dpkg --print-architecture).deb"
      sudo apt-get install -y -qq "$tmp/clab.deb"
      "$DOT/linux/apt-deps" own containerlab
    update: *containerlab
    post: "! getent group clab_admins >/dev/null || id -nG \"$USER\" | grep -qw clab_admins || sudo usermod -aG clab_admins \"$USER\""
    uninstall: |   # out of clab_admins too (the group goes with the package)
